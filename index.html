<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Foot</title>
<style>
/* =========================================================
   QUIZ FOOT — V3
   ========================================================= */
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.4 system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}

/* ---------------- RÉGIE (fenêtre de contrôle) ---------------- */
:root{--bg:#f1f4f9;--panel:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--blue:#2563eb;--red:#e11d48;--green:#16a34a;--gold:#f59e0b;--r:14px}
body.regie{background:var(--bg);color:var(--ink);overflow:hidden}
.hdr{height:60px;display:flex;align-items:center;gap:14px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:20}
.brand{font-weight:900;font-size:18px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.flag{width:30px;height:20px;border-radius:4px;background:linear-gradient(90deg,#2563eb 0 33.3%,#fff 33.3% 66.6%,#e11d48 66.6%);box-shadow:0 0 0 1px #cbd5e1}
.hdr .grow{flex:1}
.seg{display:flex;background:#eef2f7;border-radius:12px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 16px;border-radius:9px;font-weight:800;font-size:14px;color:var(--mut);cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.tvst{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--mut);white-space:nowrap}
.tvst i{width:10px;height:10px;border-radius:50%;background:#cbd5e1;display:inline-block}
.tvst.ok i{background:var(--green);box-shadow:0 0 0 4px rgba(22,163,74,.15)}
.tvst.ok{color:var(--green)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid #d5dde8;background:#fff;color:var(--ink);font:inherit;font-weight:800;font-size:14px;padding:9px 13px;border-radius:10px;cursor:pointer;transition:background .12s,border-color .12s,transform .05s;user-select:none;white-space:nowrap;line-height:1.15}
.btn:hover{border-color:#b6c2d3;background:#f8fafc}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#1d4ed8}
.btn.green{background:var(--green);border-color:var(--green);color:#fff}
.btn.green:hover{background:#15803d}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:#be123c}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3b2300}
.btn.dark{background:#0f172a;border-color:#0f172a;color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--mut)}
.btn.ghost:hover{background:#eef2f7;color:var(--ink)}
.btn.sm{padding:6px 9px;font-size:13px;border-radius:8px}
.btn.lg{padding:14px 18px;font-size:17px;border-radius:12px}
.btn.full{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.tb{border-left:7px solid var(--c)}
.btn.tb.sel{background:var(--c);border-color:var(--c);color:#fff}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.nw{flex-wrap:nowrap}
.mt{margin-top:10px}.mt2{margin-top:18px}
.mut{color:var(--mut)}
.small{font-size:12.5px}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border-radius:6px;border:1px solid #cbd5e1;border-bottom-width:2px;background:#fff;font:700 12px/1.5 ui-monospace,Menlo,monospace;text-align:center;color:var(--ink)}

.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card+.card{margin-top:12px}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);display:flex;align-items:center;gap:8px}
.card h3 .grow{flex:1}
.card h2{margin:0 0 4px;font-size:20px}

/* Animer */
.anim{display:grid;grid-template-columns:250px minmax(0,1fr) 350px;gap:14px;padding:14px;height:calc(100vh - 60px)}
.col{overflow:auto;min-height:0;padding-bottom:30px}
.col::-webkit-scrollbar{width:8px}.col::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
.rd{padding:6px}
.rd-g{font-weight:900;font-size:14px;padding:8px 10px;border-radius:10px;cursor:pointer;display:flex;gap:8px;align-items:center;margin-top:4px}
.rd-g:hover{background:#f1f5f9}
.rd-g.on{background:#eef4ff;color:var(--blue)}
.rd-s{padding:5px 10px 5px 34px;border-radius:8px;cursor:pointer;color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rd-s:hover{background:#f1f5f9;color:var(--ink)}
.rd-s.on{background:var(--blue);color:#fff;font-weight:800}
.pvroot{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 10px 30px rgba(15,23,42,.18)}
.pvroot .stage{position:absolute;left:0;top:0;transform-origin:0 0}
.anim #pvHost{max-width:calc(40vh * 16 / 9);margin:0 auto}
.navbar{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:12px}
.navbar .btn{height:56px;font-size:17px}
.nextl{font-size:12.5px;color:var(--mut);margin-top:6px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctitle{font-size:18px;font-weight:900;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.ctitle small{font-weight:700;color:var(--mut);font-size:13px}
.hostq{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;white-space:pre-line}
.hosta{background:#ecfdf5;border:1px solid #bbf7d0;border-radius:10px;padding:10px 12px;margin-bottom:10px;white-space:pre-line}
.hosta b{font-size:16px}
.big-t{font:900 54px/1 ui-monospace,"SF Mono",Menlo,monospace;text-align:center;padding:8px 0 12px;font-variant-numeric:tabular-nums}
.big-t.warn{color:var(--red)}
.tgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.tgrid .btn{padding:6px 2px;font-size:12px}
.team{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 10px;padding:10px 10px 10px 14px;border:1px solid var(--line);border-radius:12px;position:relative;overflow:hidden;margin-bottom:8px}
.team:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
.team .nm{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team .pt{font:900 30px/1 system-ui;font-variant-numeric:tabular-nums}
.team .row{grid-column:1/-1;gap:5px}
.team .row .btn{flex:1;padding:6px 0}
.dots{letter-spacing:2px;color:var(--red);font-size:16px}
.dots .off{color:#d6dde7}
.tag{display:inline-block;font-size:11px;font-weight:900;padding:2px 7px;border-radius:999px;background:#fee2e2;color:#b91c1c;text-transform:uppercase;letter-spacing:.04em}
.tag.ok{background:#dcfce7;color:#166534}
.tag.blue{background:#dbeafe;color:#1e40af}
.lrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
.lrow:first-child{border-top:0}
.lrow .grow{flex:1;min-width:0}
.ans-row{display:grid;grid-template-columns:28px 1fr auto auto;gap:8px;align-items:center;padding:6px 8px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;background:#fff}
.ans-row.on{background:#ecfdf5;border-color:#86efac}
.ans-row .n{font-weight:900;color:var(--mut);text-align:center}
.hpitches{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hpitch{position:relative;aspect-ratio:1/1.05;background:repeating-linear-gradient(180deg,#1f9d55 0 34px,#23ab5d 34px 68px);border-radius:12px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.hpl{position:absolute;transform:translate(-50%,-50%);font-size:11.5px;font-weight:800;padding:4px 7px;border-radius:7px;background:rgba(0,0,0,.5);color:#fff;border:1.5px dashed rgba(255,255,255,.9);max-width:30%;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:inherit}
.hpl:hover{background:rgba(0,0,0,.7)}
.hpl.on{background:#fff;color:#0f172a;border:1.5px solid #fff}
.hpl.empty{opacity:.55}
.hteam{font-weight:900;margin-bottom:6px;text-align:center}
.search{position:relative}
.search input{font-size:18px;padding:13px 14px;border:2px solid var(--blue);border-radius:12px}
.sugg{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;min-height:10px}
.sugg .btn.found{opacity:.6;text-decoration:line-through}
.mg{display:grid;gap:6px}
.mg .mh{font-size:12px;font-weight:900;text-align:center;padding:6px;background:#fef3c7;border-radius:8px;color:#78350f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mg .btn{padding:8px 4px;font-size:13px}
.mg .btn.done{background:var(--c,#94a3b8);border-color:var(--c,#94a3b8);color:#fff;opacity:.85}
.ladder{display:flex;gap:6px}
.ladder div{flex:1;text-align:center;padding:8px 0;border-radius:8px;background:#f1f5f9;font-weight:900;color:var(--mut)}
.ladder div.on{background:var(--gold);color:#3b2300}
.ladder.lost div.on{background:#fecdd3;color:#9f1239}
.info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e3a8a;border-radius:12px;padding:12px 14px;font-size:14px}
.info.warn{background:#fffbeb;border-color:#fde68a;color:#78350f}
.info b{font-weight:900}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-weight:800;z-index:100;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:toastin .25s ease}
@keyframes toastin{from{opacity:0;transform:translate(-50%,10px)}}

/* Préparer */
.prep{display:grid;grid-template-columns:270px minmax(0,1fr);gap:14px;padding:14px;height:calc(100vh - 60px)}
.side-i{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer;font-weight:800;font-size:14px}
.side-i:hover{background:#f1f5f9}
.side-i.on{background:#eef4ff;color:var(--blue)}
.side-i .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-i .cnt{font-size:12px;color:var(--mut);font-weight:700}
.side-i .mv{display:none;gap:2px}
.side-i:hover .mv,.side-i.on .mv{display:flex}
.side-i .mv button{border:0;background:#e2e8f0;border-radius:6px;width:22px;height:22px;cursor:pointer;font-size:11px;padding:0;color:var(--ink)}
.sep{height:1px;background:var(--line);margin:10px 4px}
.side-h{font-size:11.5px;font-weight:900;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);padding:6px 10px}
.ed{max-width:1100px}
.fl{display:block;font-size:11.5px;font-weight:900;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.05em}
input,textarea,select{width:100%;border:1px solid #cbd5e1;border-radius:10px;padding:9px 11px;font:inherit;background:#fff;color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:3px solid #bfdbfe;border-color:var(--blue)}
textarea{min-height:64px;resize:vertical}
input[type=checkbox]{width:auto;transform:scale(1.25);margin-right:6px}
input[type=color]{padding:2px;height:40px;width:56px}
input[type=range]{padding:0}
.chk{display:flex;align-items:center;font-weight:700;margin-top:10px;cursor:pointer}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.it{border:1px solid var(--line);border-radius:12px;padding:12px 14px 14px;margin:12px 0;background:#fbfcfe}
.it-h{display:flex;align-items:center;gap:8px}
.it-h .num{width:30px;height:30px;border-radius:9px;background:#0f172a;color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none}
.it-h .ttl{flex:1;font-weight:900;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imgf .imgrow{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
.thumb{width:150px;aspect-ratio:16/9;border-radius:10px;background:#e2e8f0 center/cover;border:1px solid var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;font-weight:800}
.thumb img{width:100%;height:100%;object-fit:contain;background:#0f172a}
.imgwarn{display:none;color:#b91c1c;font-size:12.5px;font-weight:700;margin-top:6px}
.thumb.bad{background:#fee2e2;outline:2px solid #fca5a5}
.thumb.bad img{display:none}
.thumb.bad:after{content:"introuvable";color:#b91c1c}
.imgf.bad .imgwarn{display:block}
.edpitch{position:relative;aspect-ratio:1/1.08;background:repeating-linear-gradient(180deg,#1f9d55 0 42px,#23ab5d 42px 84px);border-radius:14px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.edp{position:absolute;transform:translate(-50%,-50%);width:24%;display:flex;align-items:center;gap:1px}
.edp .drag{cursor:grab;color:#fff;font-size:15px;line-height:1;padding:5px 2px;user-select:none;touch-action:none;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.edp .drag:active{cursor:grabbing}
.edpitch input{flex:1;min-width:0;width:auto;font-size:12px;padding:6px 4px;text-align:center;border-radius:8px;border:2px solid #fff;font-weight:700}
.edpitch input::placeholder{color:#94a3b8;font-weight:800}
.tpl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tpl button{text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:14px;cursor:pointer;font:inherit}
.tpl button:hover{border-color:var(--blue);background:#f8fbff}
.tpl b{display:block;font-size:15px;margin:4px 0}
.tpl span{font-size:12.5px;color:var(--mut)}
.tpl .ic{font-size:26px}
details{border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0;background:#fff}
details summary{cursor:pointer;font-weight:900}
.mq{display:grid;grid-template-columns:90px 1fr 1fr;gap:8px;align-items:center;margin-top:6px}
.mq .lbl{font-size:12px;font-weight:900;color:var(--mut)}
.teamed{display:grid;grid-template-columns:56px 1fr 110px;gap:10px;align-items:center;margin-top:8px}
.cntbtns{display:flex;gap:6px}
.cntbtns .btn{width:46px}

/* Aide */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:200}
.modal .box{background:#fff;border-radius:18px;padding:24px 28px;max-width:760px;width:92%;max-height:88vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.modal h2{margin:0 0 14px}
.keys{display:grid;grid-template-columns:auto 1fr;gap:9px 16px;align-items:center}
.keys div:nth-child(odd){text-align:right;white-space:nowrap}

/* ---------------- ÉCRAN TV (scène 1920×1080) ---------------- */
body.tvbody{background:#000;overflow:hidden;cursor:none}
body.tvbody.mouse{cursor:default}
.tvroot{position:fixed;inset:0;overflow:hidden;background:#000}
.tvroot .stage{position:absolute;left:0;top:0;transform-origin:0 0}
.tvhint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(15,23,42,.85);color:#fff;padding:12px 20px;border-radius:12px;font-weight:700;z-index:10;transition:opacity .6s;font-size:15px}
.tvhint.hide{opacity:0;pointer-events:none}

.stage{width:1920px;height:1080px;overflow:hidden;color:var(--ink);font-family:system-ui,-apple-system,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --ink:#fff;--card:#fff;--cardInk:#0b1b3f;--cardMut:#64748b;--accent:#fbbf24;--accentInk:#2a1a00;--hid:rgba(8,22,64,.62);--hidInk:rgba(255,255,255,.88);--hidBd:rgba(255,255,255,.5);--ok:#16a34a;--ko:#e11d48;--veilc:#061238;--shadow:0 16px 40px rgba(0,0,0,.35);--tsh:0 3px 16px rgba(0,0,0,.55);
  background:radial-gradient(1100px 760px at 10% -10%,#2563eb 0%,transparent 62%),radial-gradient(1100px 760px at 90% -10%,#e11d48 0%,transparent 62%),linear-gradient(180deg,#0d2c80,#0a1a4a)}
.stage.th-bleu{--veilc:#0a3aa6;background:radial-gradient(1500px 900px at 50% -20%,#60a5fa,transparent 60%),linear-gradient(160deg,#1d4ed8,#2563eb 50%,#0e7490)}
.stage.th-clair{--ink:#0b1b3f;--card:#fff;--cardInk:#0b1b3f;--hid:#dde5f0;--hidInk:#475569;--hidBd:#c3cfe0;--veilc:#eef3fa;--shadow:0 12px 30px rgba(15,23,42,.14);--tsh:none;background:linear-gradient(180deg,#f8fafc,#dfe7f2)}
.stage.th-nuit{--card:#14294b;--cardInk:#fff;--cardMut:#9fb3cf;--hid:rgba(0,0,0,.4);--hidBd:rgba(255,255,255,.22);--veilc:#030712;background:radial-gradient(circle at top,#173d76,#050b16 65%)}
.stage .bgl{position:absolute;inset:0;background-size:cover;background-position:center}
.stage .veil{position:absolute;inset:0;background:var(--veilc)}
.stage .content{position:absolute;inset:0}
.stage .fx{position:absolute;inset:0;pointer-events:none;z-index:50}
.content.fadein{animation:fadein .45s ease}
@keyframes fadein{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.85);filter:brightness(1.6)}100%{transform:scale(1);filter:none}}
.pl.pop{animation:plpop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes plpop{0%{transform:translate(-50%,-50%) scale(.6);filter:brightness(1.6)}100%{transform:translate(-50%,-50%) scale(1)}}
.sc.pop{animation:scpop .6s ease}
@keyframes scpop{0%{transform:scale(1)}30%{transform:scale(1.08);box-shadow:0 0 0 8px var(--c)}100%{transform:scale(1)}}

.sl{position:absolute;inset:0}
.tsh{text-shadow:var(--tsh)}
.chip{position:absolute;left:48px;top:36px;background:var(--card);color:var(--cardInk);font-weight:900;font-size:27px;letter-spacing:.05em;text-transform:uppercase;padding:13px 28px;border-radius:999px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;z-index:5;max-width:1300px;white-space:nowrap;overflow:hidden}
.chip .n{color:var(--cardMut);font-weight:800}
.chip .cteam{background:var(--c);color:#fff;padding:4px 16px;border-radius:999px;letter-spacing:.04em}
.draw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:40px 80px;text-align:center}
.draw .dic{font-size:110px;line-height:1;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35));animation:dshake .5s ease-in-out 0s 4}
.draw .dttl{font-size:120px;font-weight:900;text-transform:uppercase;line-height:.95;color:var(--ink);text-shadow:var(--tsh)}
.draw .dsub{font-size:34px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;background:var(--card);color:var(--cardInk);padding:12px 36px;border-radius:999px;box-shadow:var(--shadow)}
.draw .dgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:30px;margin-top:26px;max-width:1760px}
.draw .dcard{width:400px;background:var(--card);border-radius:28px;box-shadow:var(--shadow);overflow:hidden;animation:dland .55s cubic-bezier(.2,1.6,.4,1) var(--land) both;border:6px solid transparent}
.draw .dgrid.n5 .dcard,.draw .dgrid.n6 .dcard{width:520px}
.draw .dhead{font-size:38px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--cardInk);padding:18px 10px 12px}
.draw .dslot{height:120px;overflow:hidden;margin:0 18px 18px;border-radius:18px;background:#0b1b3f;position:relative}
.draw .dpl{display:flex;flex-direction:column;gap:6px;margin:-4px 18px 18px;opacity:0;animation:dpop .5s ease var(--land) forwards}
.draw .dpl div{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:900;text-transform:uppercase;color:var(--cardInk);text-align:left}
.draw .dpl b{flex:0 0 44px;height:44px;border-radius:50%;background:var(--c);color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}
.draw .dslot:after{content:"";position:absolute;inset:0;background:linear-gradient(#0b1b3f,transparent 28%,transparent 72%,#0b1b3f);pointer-events:none;animation:dfade .3s linear var(--land) forwards}
.draw .dreel{animation:dspin var(--dur) cubic-bezier(.12,.6,.2,1) forwards}
.draw .dname{height:120px;display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff;font-size:38px;font-weight:900;text-transform:uppercase;line-height:1;padding:0 14px;border-bottom:3px solid rgba(255,255,255,.25)}
.draw .dgo{font-size:56px;font-weight:900;text-transform:uppercase;background:var(--accent);color:var(--accentInk);padding:14px 60px;border-radius:999px;box-shadow:var(--shadow);margin-top:24px;opacity:0;animation:dpop .6s cubic-bezier(.2,1.6,.4,1) var(--fin) forwards}
@keyframes dspin{from{transform:translateY(0)}to{transform:translateY(var(--to))}}
@keyframes dland{0%{transform:scale(1)}55%{transform:scale(1.08);border-color:var(--accent);box-shadow:0 0 0 8px var(--accent),var(--shadow)}100%{transform:scale(1);border-color:var(--accent);box-shadow:0 0 0 6px var(--accent),var(--shadow)}}
@keyframes dfade{to{opacity:0}}
@keyframes dpop{0%{opacity:0;transform:scale(.4)}100%{opacity:1;transform:scale(1)}}
@keyframes dshake{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.tmr{position:absolute;right:48px;top:26px;min-width:220px;text-align:center;background:var(--card);color:var(--cardInk);font-size:70px;line-height:1.1;font-weight:900;font-variant-numeric:tabular-nums;padding:6px 32px;border-radius:24px;box-shadow:var(--shadow);z-index:6}
.tmr.big{left:50%;top:50%;right:auto;transform:translate(-50%,-55%);font-size:300px;padding:10px 90px;border-radius:60px}
.bigres{position:absolute;left:0;right:0;top:735px;display:flex;justify-content:center;z-index:7;pointer-events:none}
.sl.noscores .bigres{top:790px}
.bigres > div{font-size:76px;font-weight:900;text-transform:uppercase;line-height:1.05;color:#fff;padding:18px 64px;border-radius:999px;box-shadow:var(--shadow);max-width:1700px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bigres .ok{background:var(--ok)}
.bigres .ko{background:var(--ko)}
.tmr.warn{background:var(--ko);color:#fff;animation:tpulse 1s infinite}
.tmr.big.warn{animation:tpulseb 1s infinite}
.tmr.over{background:var(--ko);color:#fff}
@keyframes tpulse{50%{transform:scale(1.07)}}
@keyframes tpulseb{50%{transform:translate(-50%,-55%) scale(1.04)}}
.body{position:absolute;left:60px;right:60px;top:128px;bottom:160px}
.noscores .body{bottom:56px}
.fit{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;transform-origin:top center}
.body.stretch .fit{justify-content:flex-start;align-items:stretch;gap:14px}
.imgmiss{background:rgba(225,29,72,.85);color:#fff;border-radius:22px;padding:30px 50px;font-size:40px;font-weight:900;text-align:center;box-shadow:var(--shadow)}
.imgmiss small{display:block;font-size:24px;font-weight:700;opacity:.9;margin-top:6px}
.fullimg+.imgmiss,.imgmiss.full{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.h1{font-size:74px;font-weight:900;text-transform:uppercase;text-align:center;color:var(--ink);letter-spacing:.01em;line-height:1.05;max-width:1700px}
.h2{font-size:56px;font-weight:900;text-transform:uppercase;text-align:center;color:var(--ink);line-height:1.05;max-width:1700px}
.card2{background:var(--card);color:var(--cardInk);border-radius:28px;box-shadow:var(--shadow)}
.qcard{background:var(--card);color:var(--cardInk);border-radius:30px;box-shadow:var(--shadow);padding:44px 64px;font-size:62px;font-weight:900;text-align:center;line-height:1.15;max-width:1650px;white-space:pre-line}
.qcard.big{font-size:76px;padding:60px 80px}
.ans{background:var(--ok);color:#fff;font-size:62px;font-weight:900;padding:22px 60px;border-radius:26px;box-shadow:var(--shadow);text-align:center;text-transform:uppercase;line-height:1.1;max-width:1700px;white-space:pre-line}
.ans.gold{background:var(--accent);color:var(--accentInk)}
.ans.red{background:var(--ko)}
.ans .by{display:block;font-size:30px;margin-top:6px;opacity:.85;text-transform:none}
.ansfloat{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);z-index:7}
.imgbox{flex:1 1 auto;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
.imgbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:22px;border:6px solid #fff;box-shadow:var(--shadow);background:#0b1b3f}
.media2{flex:1 1 auto;min-height:0;width:100%;display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center}
.media2{grid-template-rows:minmax(0,1fr)}
.media2 > *{min-height:0;max-height:100%}
.media2 .imgbox{height:100%}
.media2 .qcard{font-size:52px;padding:40px 48px}
.media2 .qcard.q-sm{font-size:40px;padding:30px 38px}
.media2 .qcard.q-xs{font-size:32px;padding:24px 30px}
.qcard.big.q-md{font-size:62px}
.qcard.big.q-sm{font-size:50px}
.fullimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

.scores{position:absolute;left:48px;right:48px;bottom:26px;height:112px;display:flex;gap:18px;z-index:5}
.sc{flex:1;min-width:0;background:var(--card);color:var(--cardInk);border-radius:22px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto;align-content:center;column-gap:16px;padding:0 26px 0 32px;position:relative;overflow:hidden;transition:transform .3s}
.sc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:13px;background:var(--c)}
.sc .nm{font-size:26px;font-weight:900;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;align-self:end}
.sc .pt{font-size:64px;font-weight:900;font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:2;align-self:center;line-height:1}
.sc .ex{font-size:30px;line-height:1.1;align-self:start;white-space:nowrap}
.sc .ex .e{color:var(--ko);margin-right:4px}
.sc .ex .e.off{opacity:.18;color:var(--cardInk)}
.sc .ex .tg{font-size:17px;font-weight:900;background:var(--c);color:#fff;padding:3px 10px;border-radius:999px;vertical-align:middle;margin-left:6px;text-transform:uppercase;letter-spacing:.04em}
.sc.hand{transform:translateY(-12px);box-shadow:0 0 0 5px var(--c),var(--shadow)}
.sc.out{opacity:.45}
.sl.turnmode .sc:not(.turn){opacity:.62;filter:saturate(.6)}
.sl.turnmode:not(.noscores) .body{bottom:224px}
.sc.turn{background:var(--c);color:#fff;transform:translateY(-16px) scale(1.04);box-shadow:0 0 0 6px #fff,0 0 34px 6px var(--c);animation:turnglow 1.4s ease-in-out infinite;z-index:2}
.sc.turn:before{background:#fff}
.sc.turn .ex .pk{color:#fff}
.sc.turn .ex .tg{background:#fff;color:var(--c)}
.turnlab{position:absolute;bottom:158px;height:58px;display:flex;align-items:center;justify-content:center;z-index:6;pointer-events:none}
.turnlab span{background:var(--c);color:#fff;font-size:34px;font-weight:900;text-transform:uppercase;letter-spacing:.04em;padding:6px 30px;border-radius:999px;box-shadow:0 0 0 4px #fff,var(--shadow);white-space:nowrap;animation:turnbounce 1s ease-in-out infinite}
.turntop{position:absolute;left:50%;top:34px;transform:translateX(-50%);z-index:6;background:var(--c);color:#fff;font-size:40px;font-weight:900;text-transform:uppercase;padding:8px 40px;border-radius:999px;box-shadow:0 0 0 4px #fff,var(--shadow);white-space:nowrap;animation:turnglow2 1.4s ease-in-out infinite}
@keyframes turnglow{0%,100%{box-shadow:0 0 0 6px #fff,0 0 26px 4px var(--c)}50%{box-shadow:0 0 0 6px #fff,0 0 60px 18px var(--c)}}
@keyframes turnglow2{0%,100%{box-shadow:0 0 0 4px #fff,0 0 20px 2px var(--c)}50%{box-shadow:0 0 0 4px #fff,0 0 50px 14px var(--c)}}
@keyframes turnbounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.scores.many{gap:12px}
.scores.many .sc{padding:0 16px 0 26px}
.scores.many .sc .nm{font-size:20px}
.scores.many .sc .pt{font-size:50px}
.scores.many .sc .ex{font-size:24px}

/* Intro */
.intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:28px;padding:0 120px}
.intro .ic{font-size:130px;line-height:1;filter:drop-shadow(0 10px 20px rgba(0,0,0,.35))}
.intro .num{font-size:28px;font-weight:900;letter-spacing:.3em;background:var(--card);color:var(--cardInk);padding:12px 34px 12px 40px;border-radius:999px;box-shadow:var(--shadow)}
.intro .ttl{font-size:150px;font-weight:900;text-transform:uppercase;line-height:.95;color:var(--ink);text-shadow:var(--tsh);letter-spacing:.01em}
.intro .bar{width:460px;height:16px;border-radius:9px;background:linear-gradient(90deg,#2563eb 0 33.3%,#fff 33.3% 66.6%,#e11d48 66.6%);box-shadow:var(--shadow)}
.intro .sub{font-size:46px;font-weight:800;max-width:1500px;color:var(--ink);text-shadow:var(--tsh);white-space:pre-line;line-height:1.25}

/* Five */
.hints{width:1560px;display:flex;flex-direction:column;gap:12px}
.hint{display:grid;grid-template-columns:170px 1fr;min-height:88px;border-radius:22px;overflow:hidden;background:var(--hid);border:3px solid var(--hidBd)}
.hint .hpts{display:flex;align-items:center;justify-content:center;font-size:32px;font-weight:900;color:var(--hidInk);background:rgba(255,255,255,.08)}
.hint .ht{display:flex;align-items:center;padding:10px 32px;font-size:40px;font-weight:800;color:var(--hidInk);line-height:1.15}
.hint.on{background:var(--card);border-color:var(--card);box-shadow:var(--shadow)}
.hint.on .hpts{background:#1d4ed8;color:#fff}
.hint.on .ht{color:var(--cardInk)}
.hint.cur{border-color:var(--accent);box-shadow:0 0 0 5px var(--accent),var(--shadow)}

/* XI */
.xi{width:1760px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,104px);grid-auto-flow:column;gap:16px 26px}
.xa{display:grid;grid-template-columns:96px 1fr 130px;align-items:center;border-radius:22px;background:var(--hid);border:3px solid var(--hidBd);overflow:hidden}
.xa .xn{height:100%;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;background:rgba(255,255,255,.1);color:var(--hidInk)}
.xa .xt{padding:0 22px;font-size:36px;font-weight:900;text-transform:uppercase;line-height:1.05;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.xa .xp{height:100%;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:var(--hidInk)}
.xa.on{background:var(--card);border-color:var(--card);color:var(--cardInk);box-shadow:var(--shadow)}
.xa.on .xn{background:#1d4ed8;color:#fff}
.xa.on .xp{background:var(--accent);color:var(--accentInk)}

/* Compo */
.mtitle{font-size:44px;font-weight:900;text-transform:uppercase;text-align:center;color:var(--ink);white-space:pre-line;line-height:1.1}
.pitches{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.pitch{position:relative;border-radius:24px;border:5px solid rgba(255,255,255,.9);background:repeating-linear-gradient(180deg,#178a45 0 76px,#1c9a4f 76px 152px);overflow:hidden;box-shadow:var(--shadow)}
.pk-box{position:absolute;left:22%;right:22%;bottom:-5px;height:17%;border:4px solid rgba(255,255,255,.55)}
.pk-six{position:absolute;left:38%;right:38%;bottom:-5px;height:7%;border:4px solid rgba(255,255,255,.55)}
.pk-mid{position:absolute;left:50%;top:-120px;width:240px;height:240px;margin-left:-120px;border:4px solid rgba(255,255,255,.55);border-radius:50%}
.pname{position:absolute;left:18px;top:16px;background:var(--card);color:var(--cardInk);font-size:28px;font-weight:900;padding:8px 22px;border-radius:999px;text-transform:uppercase;z-index:3;box-shadow:0 6px 16px rgba(0,0,0,.25);max-width:62%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl{position:absolute;transform:translate(-50%,-50%);min-width:118px;max-width:200px;padding:10px 14px;border-radius:16px;background:rgba(4,30,14,.55);border:3px dashed rgba(255,255,255,.85);color:#fff;font-size:22px;font-weight:900;text-align:center;line-height:1.1;z-index:2}
.pl span{opacity:.85;letter-spacing:.05em}
.pl.on{background:#fff;color:#0b1b3f;border:3px solid #fff;box-shadow:0 8px 18px rgba(0,0,0,.4);font-size:23px;text-transform:uppercase;max-width:190px}
.pl.on.long{font-size:18px;padding:8px 10px;max-width:170px}
.pl.on.vlong{font-size:15px;padding:7px 8px;max-width:160px;letter-spacing:-.01em}

/* Banc des remplaçants */
.pcol{display:flex;flex-direction:column;gap:10px;min-height:0}
.pcol .pitch{flex:1;min-height:0}
.bench{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}
.bench .blab{font-size:20px;font-weight:900;color:var(--ink);letter-spacing:.1em;text-shadow:var(--tsh)}
.bench .bp{background:rgba(4,30,14,.6);border:3px dashed rgba(255,255,255,.85);color:#fff;font-size:22px;font-weight:900;padding:7px 18px;border-radius:14px}
.bench .bp.on{background:#fff;color:#0b1b3f;border-style:solid;text-transform:uppercase}
/* Mort subite */
.sdcount{font-size:40px;font-weight:900;color:var(--ink)}
.sdlist{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1760px}
.aulist{margin-top:18px}
.aulist .sdchip{font-size:24px;padding:8px 16px}
.sdchip{background:var(--card);color:var(--cardInk);border-left:12px solid var(--c);padding:10px 20px;border-radius:14px;font-size:28px;font-weight:900;box-shadow:var(--shadow);text-transform:uppercase}
/* Money */
.mgrid{width:100%;flex:1 1 auto;min-height:0;display:grid;gap:18px}
.mcol{display:grid;grid-template-rows:96px repeat(6,1fr);gap:10px;min-height:0}
.mhead{flex-direction:column;background:var(--accent);color:var(--accentInk);border-radius:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:28px;font-weight:900;text-transform:uppercase;line-height:1.05;padding:0 14px;box-shadow:var(--shadow)}
.mcell{background:var(--card);color:var(--cardInk);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;font-weight:800;box-shadow:var(--shadow);line-height:1.05}
.mcell b{font-size:40px;font-weight:900}
.mcell small{font-size:18px;color:var(--cardMut);font-weight:800;text-transform:uppercase;letter-spacing:.05em}
.mcell.done{background:var(--c,rgba(100,116,139,.55));color:#fff;opacity:.92}
.mcell.done b{font-size:26px;text-transform:uppercase;max-width:92%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mval{font-size:34px;font-weight:900;background:var(--accent);color:var(--accentInk);padding:10px 30px;border-radius:999px;box-shadow:var(--shadow);text-transform:uppercase}

/* Risk */
.risk{width:1700px;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:330px 1fr;gap:50px;align-items:center}
.rungs{display:flex;flex-direction:column-reverse;gap:14px}
.rung{height:104px;border-radius:22px;background:var(--hid);border:3px solid var(--hidBd);color:var(--hidInk);display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900}
.rung.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.rung.next{background:var(--card);border-color:var(--accent);color:var(--cardInk);box-shadow:0 0 0 5px var(--accent),var(--shadow)}
.rung.lost{background:var(--ko);border-color:var(--ko);color:#fff}
.rung.sec{background:var(--accent);border-color:var(--accent);color:var(--accentInk)}
.rright{display:flex;flex-direction:column;gap:26px;align-items:center;min-height:0;height:100%;justify-content:center}
.tpill{font-size:40px;font-weight:900;background:var(--c);color:#fff;padding:12px 40px;border-radius:999px;text-transform:uppercase;box-shadow:var(--shadow)}

/* Auction */
.auc{display:flex;gap:50px;align-items:center;justify-content:center;flex:1 1 auto;min-height:0;width:100%}
.auc .imgbox{flex:0 1 46%;height:100%}
.bidc{background:var(--card);color:var(--cardInk);border-radius:36px;box-shadow:var(--shadow);padding:40px 80px;text-align:center;min-width:620px}
.bidc .lab{font-size:34px;font-weight:900;text-transform:uppercase;color:var(--cardMut);letter-spacing:.06em}
.bidc .bid{font-size:220px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.bidc .prog{font-size:46px;font-weight:900;margin-top:10px}
.bidc .prog i{display:inline-block;width:28px;height:28px;border-radius:50%;background:#cbd5e1;margin:0 5px;vertical-align:middle}
.bidc .prog i.on{background:var(--ok)}

/* Sudden */
.track{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.tk{background:var(--card);color:var(--cardInk);border-radius:24px;box-shadow:var(--shadow);padding:18px 34px;text-align:center;border-top:12px solid var(--c);min-width:260px}
.tk .nm{font-size:30px;font-weight:900;text-transform:uppercase}
.tk .dt{font-size:64px;letter-spacing:6px;color:var(--c);line-height:1.1}
.tk .dt .off{opacity:.2;color:var(--cardInk)}
.tk.tkwin{box-shadow:0 0 0 6px var(--accent),var(--shadow)}

/* Classement */
.rcw{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:30px;width:100%;align-items:start}
.rcw.solo{grid-template-columns:minmax(0,1fr)}
.rct{display:grid;gap:8px}
.rct .rch{background:var(--c,transparent);color:#fff;font-size:26px;font-weight:900;text-transform:uppercase;text-align:center;border-radius:14px;padding:10px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rct .rcg{background:var(--card);color:var(--cardInk);font-size:30px;font-weight:900;text-transform:uppercase;border-radius:12px;padding:12px 18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rct .rcc{background:var(--card);color:var(--cardInk);font-size:36px;font-weight:900;text-align:center;border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center}
.rct .rcc .z{opacity:.25}
.rct .tot{background:var(--accent);color:var(--accentInk)}
.rct .rcc.tot{background:var(--c);color:#fff;font-size:34px}
.rcside{display:flex;flex-direction:column;gap:16px}
.rcs{background:var(--card);color:var(--cardInk);border-radius:20px;padding:16px 22px;box-shadow:var(--shadow)}
.rcs.gold{box-shadow:0 0 0 5px var(--accent),var(--shadow)}
.rcs-h{font-size:24px;font-weight:900;text-transform:uppercase;margin-bottom:8px}
.rcs-r{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:800;text-transform:uppercase;padding:3px 0}
.rcs-r i{width:16px;height:16px;border-radius:50%;flex:none}
.rcs-r span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rcs-big{font-size:46px;font-weight:900;text-transform:uppercase;color:var(--c)}
.rcs-sub{font-size:22px;font-weight:700;opacity:.7}
.ss{width:1300px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ss-t{font-size:120px;font-weight:900;text-transform:uppercase;text-align:center;line-height:1;color:#f5b700;text-shadow:0 4px 0 #9a6a00,0 10px 30px rgba(0,0,0,.6);letter-spacing:.02em}
.ss-s{font-size:30px;font-weight:900;text-transform:uppercase;text-align:center;color:#fff;margin:-4px 0 12px;letter-spacing:.12em}
.ssr{display:grid;grid-template-columns:90px minmax(0,1fr) 260px 260px;align-items:center;background:linear-gradient(#1d4ed8,#1e3a8a);color:#fff;border-radius:12px;padding:0 10px;height:62px;font-weight:900;font-size:36px;text-transform:uppercase;border:2px solid rgba(147,197,253,.6)}
.ssr .ssp{text-align:center;font-size:40px}
.ssr .ssn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:14px}
.ssr .ssw{text-align:center;color:#ffd34d}
.ssr .ssj{text-align:center}
.ssr.head{background:rgba(11,27,63,.85);height:56px;font-size:24px;border-color:rgba(245,183,0,.5)}
.ssr.head .ssw{color:#f5b700}
.ssr.first{background:linear-gradient(#ffd34d,#f5b700);color:#0b1b3f;border-color:#fff3b0;box-shadow:0 0 30px rgba(245,183,0,.6)}
.ssr.first .ssw{color:#0b1b3f}
.ssr.last{background:linear-gradient(#e11d48,#9f1239);border-color:#fda4af}
.sstab{width:100%;border-collapse:collapse;margin-top:10px}
.sstab th{text-align:left;font-size:12px;color:var(--mut);text-transform:uppercase;padding:4px}
.sstab td{padding:3px 4px}
.sstab td input{width:100%;height:32px;padding:4px 8px}
.sstab td:nth-child(3) input,.sstab td:nth-child(4) input{width:80px}
.snt{padding:8px 12px;margin:8px 0;background:rgba(100,116,139,.06);border-radius:10px}
.snp{display:flex;align-items:center;gap:10px;margin:6px 0 0 26px}

const uid = () => Math.random().toString(36).slice(2, 10);
const esc = x => String(x ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const clone = o => JSON.parse(JSON.stringify(o));
const firstLine = s => String(s || '').split('\n')[0].trim();
const fmtT = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
function src(p){ p = String(p || '').trim(); if(!p) return ''; if(/^(data:|blob:|https?:|file:)/i.test(p)) return p; return p.split('/').map(encodeURIComponent).join('/'); }
const tplOf = g => TEMPLATES.find(t => t.key === g.tpl) || TEMPLATES.find(t => t.type === g.type) || {};
const teams = () => S.doc.teams;
const teamById = id => S.doc.teams.find(t => t.id === id);
const plural = (n, w) => n + ' ' + w + (Math.abs(n) > 1 ? 's' : '');
const ptsTxt = n => n + ' PT' + (Math.abs(n) > 1 ? 'S' : '');

function newTeam(i){ const p = TEAM_PRESETS[i % TEAM_PRESETS.length]; return {id:uid(), name:p[0], color:p[1], score:0}; }
function newGame(tplKey){
  const tp = TEMPLATES.find(t => t.key === tplKey) || TEMPLATES[0];
  const def = T[tp.type];
  const g = {id:uid(), type:tp.type, tpl:tp.key, title:tp.title,
    intro:{on: tp.intro !== false && !def.single, image:'', sub:tp.sub || ''},
    opts:Object.assign({timerMode:'none', timer:0}, def.opts ? def.opts() : {}, tp.opts || {}), items:[]};
  const n = def.single ? 0 : (tp.n ?? def.n ?? 1);
  for(let i = 0; i < n; i++) g.items.push(def.newItem(g, i));
  return g;
}

/* =========================================================
   DÉROULÉ (liste à plat des slides)
   ========================================================= */
function flat(){
  const out = [];
  S.doc.games.forEach((g, gi) => {
    const def = T[g.type]; if(!def) return;
    if(g.intro && g.intro.on) out.push({g, gi, kind:'intro', key:g.id + ':intro'});
    if(def.single) out.push({g, gi, kind:'main', key:g.id + ':main'});
    else g.items.forEach((it, ii) => out.push({g, gi, kind:'item', it, ii, key:g.id + ':' + it.id}));
  });
  return out;
}
function curIdx(list){ list = list || flat(); const i = list.findIndex(x => x.key === S.live.pos); return i < 0 ? 0 : i; }
function cur(){ const l = flat(); return l[curIdx(l)]; }
function liveOf(sl){
  const id = sl.it ? sl.it.id : sl.g.id;
  const m = S.live.items;
  if(!m[id]) m[id] = (T[sl.g.type].live ? T[sl.g.type].live(sl) : {});
  return m[id];
}
function gameLive(g, def){ const m = S.live.items; const k = 'g_' + g.id; if(!m[k]) m[k] = def(); return m[k]; }
function ctx(sl){ return {sl, g:sl.g, it:sl.it, ii:sl.ii, gi:sl.gi, L:liveOf(sl), def:T[sl.g.type]}; }
function slideName(sl){
  if(sl.kind === 'intro') return '🎬 Affiche de début';
  if(sl.kind === 'main') return sl.g.title;
  return T[sl.g.type].name(sl.g, sl.it, sl.ii);
}
function tMode(g){ const o = g.opts || {}; return o.timerMode || (Number(o.timer) > 0 ? 'item' : 'none'); }
function slideDur(sl){
  if(!sl) return 0;
  const m = tMode(sl.g);
  if(m === 'none') return 0;
  if(m === 'game') return Number(sl.g.opts.timer) || 0;
  if(sl.kind === 'intro') return 0;
  if(sl.it && sl.it.timer !== null && sl.it.timer !== undefined && sl.it.timer !== '') return Number(sl.it.timer) || 0;
  return Number(sl.g.opts && sl.g.opts.timer) || 0;
}

function slPlayable(it){ const img = String(it.image || '').trim(); return !!(it.answer || String(it.text || '').trim() || (img && img !== String(S.doc.settings.bg || '').trim())); }
function slRecap(c){
  const g = c.g, list = g.items.map((it, i) => ({it, i})).filter(x => slPlayable(x.it));
  if(!list.length) return '';
  let ok = 0, ko = 0;
  const chips = list.map((x, k) => { const L = S.live.items[x.it.id] || {}; if(L.res === 'ok') ok++; if(L.res === 'ko') ko++;
    const sl = flat().find(f => f.it && f.it.id === x.it.id), cur0 = c.it && c.it.id === x.it.id;
    const st = L.res === 'ok' ? 'background:#16a34a;color:#fff;border-color:#16a34a' : L.res === 'ko' ? 'background:#e11d48;color:#fff;border-color:#e11d48' : '';
    return `<button class="btn sm" style="min-width:38px;${st};${cur0 ? 'outline:3px solid #0f172a;outline-offset:1px' : ''}" title="${esc(x.it.answer || '')}" onclick="goKey('${sl ? sl.key : ''}')">${k + 1}</button>`; }).join('');
  const todo = list.length - ok - ko;
  return `<div class="sep"></div><div style="font-weight:900;margin-bottom:6px">📋 Bilan de la série : <span style="color:#16a34a">${ok} trouvé${ok > 1 ? 's' : ''}</span> · <span style="color:#e11d48">${ko} raté${ko > 1 ? 's' : ''}</span> · <span class="mut">${todo} à jouer</span> <span class="mut small">sur ${list.length}</span></div>
    <div class="row">${chips}</div><div class="small mut mt">Clique sur un numéro pour y revenir (vert = trouvé, rouge = raté, blanc = à jouer).</div>`;
}

/* ---- Mort subite (élimination) ---- */
function sdList(it){ return String(it.answers || '').split('\n').map(x => x.trim()).filter(Boolean); }
function sdAlive(L){ return teams().filter(t => !L.out[t.id]); }
function gOrderTeams(g){ const ids = teams().map(t => t.id); let o = ((g && g.opts && g.opts.order) || []).filter(id => ids.includes(id)); ids.forEach(id => { if(!o.includes(id)) o.push(id); }); return o.map(teamById); }
// premier à jouer pour l'élément n° ii : on fait tourner l'ordre d'un thème à l'autre
function gStarter(g, ii){ const o = gOrderTeams(g); return o.length ? o[(Number(ii) || 0) % o.length].id : null; }
function gApplyStarters(g){ if(!['sudden','intrus'].includes(g.type)) return; g.items.forEach((it, ii) => { const L = S.live.items[it.id]; if(!L) return;
  const fresh = g.type === 'sudden' ? !L.order.length && !Object.keys(L.out).length && !L.winner : !Object.keys(L.removed).length && !L.lost && !L.done;
  if(fresh) L.turn = gStarter(g, ii); }); }
function sdNext(L, from, g){ const ts = g ? gOrderTeams(g) : teams(), i = ts.findIndex(t => t.id === from); for(let k = 1; k <= ts.length; k++){ const t = ts[(i + k + ts.length) % ts.length]; if(!L.out[t.id]) return t.id; } return null; }
function sdMatches(c, q){
  q = norm(q); if(!q) return [];
  return sdList(c.it).map((line, i) => { const n = norm(line), w = n.split(' ');
    const score = n === q ? 4 : w.includes(q) ? 3 : n.startsWith(q) ? 2 : n.includes(q) ? 1 : 0;
    return {i, line, score, by:c.L.said[i]}; }).filter(x => x.score).sort((a, b) => b.score - a.score || (a.by ? 1 : 0) - (b.by ? 1 : 0));
}

/* ---- Money Time ---- */
const MONEY_LEVELS = () => [{name:'Facile', pts:1, n:2}, {name:'Moyen', pts:3, n:2}, {name:'Difficile', pts:5, n:2}];
function moLevels(g){ if(!g.opts.levels || !g.opts.levels.length) g.opts.levels = MONEY_LEVELS(); return g.opts.levels; }
function moRows(g){ return moLevels(g).flatMap((lv, li) => Array.from({length:clamp(Number(lv.n) || 0, 0, 12)}, (_, k) => ({li, k, pts:Number(lv.pts) || 0, name:lv.name || ('Niveau ' + (li + 1))}))); }
function moFixItem(g, it){
  const lvs = moLevels(g);
  (it.themes || []).forEach(th => {
    if(!th.lv){ const q = th.q || []; th.lv = [q.slice(0, 2), q.slice(2, 4), q.slice(4, 6)]; delete th.q; }
    lvs.forEach((L, li) => { th.lv[li] = th.lv[li] || []; while(th.lv[li].length < clamp(Number(L.n) || 0, 0, 12)) th.lv[li].push({q:'', a:''}); });
  });
}
function moOrder(g){ const ids = teams().map(t => t.id); let o = (g.opts.order || []).filter(id => ids.includes(id)); ids.forEach(id => { if(!o.includes(id)) o.push(id); }); return o; }
function moTurnTeam(c){ const o = moOrder(c.g); return o.length ? teamById(o[(Number(c.L.turn) || 0) % o.length]) : null; }
function moPlayers(g, tid){ const t = teamById(tid); if(!t) return []; const base = pkPlayers(t), po = ((g.opts.porder || {})[tid] || []).filter(n => base.includes(n)); base.forEach(n => { if(!po.includes(n)) po.push(n); }); return po; }
function moTurnPlayer(c){ const t = moTurnTeam(c); if(!t) return ''; const pl = moPlayers(c.g, t.id); if(!pl.length) return ''; const n = moOrder(c.g).length || 1, round = Math.floor((Number(c.L.turn) || 0) / n); return pl[round % pl.length]; }
function moStats(g){ const out = {}; (g.items || []).forEach(it => { const L = S.live.items[it.id]; if(!L || !L.plog) return; Object.values(L.plog).forEach(e => { if(!e.player) return; const k = e.tid + '|' + e.player; out[k] = out[k] || {tid:e.tid, player:e.player, good:0, total:0}; out[k].total++; if(e.ok) out[k].good++; }); }); return Object.values(out); }
function moSetTurn(tid){ const c = ctx(cur()), o = moOrder(c.g), n = o.length, i = o.indexOf(tid); if(i < 0) return; const t = Number(c.L.turn) || 0; c.L.turn = t - (t % n) + i; commit(); }
function moQ(th, li, k){ return (th && th.lv && th.lv[li] && th.lv[li][k]) || {q:'', a:''}; }
function moParse(g, key){ const p = String(key || '').split('-').map(Number); if(p.length !== 3) return null; const lv = moLevels(g)[p[1]]; if(!lv) return null; return {ti:p[0], li:p[1], k:p[2], pts:Number(lv.pts) || 0, name:lv.name || ''}; }
T.money = {

  name:(g, it, i) => g.items.length > 1 ? 'Grille ' + (i + 1) : 'La grille',

    const tt = moTurnTeam(c), tp = moTurnPlayer(c);
    return frame(c, {body, cls:'stretch', team:tt ? Object.assign({}, tt, {name:tp || tt.name}) : null, teamLbl:'À vous de choisir', turn:tt ? tt.id : null, turnName:tp});
  },
  ctrl(c){
    const it = c.it, L = c.L, g = c.g; moFixItem(g, it);

      const th = it.themes[o.ti], q = moQ(th, o.li, o.k);
      return `<div class="row"><span class="tag blue">${esc(th.name)}</span><span class="tag ok">${ptsTxt(o.pts)} · ${esc(o.name)}</span></div>
        <div class="hostq mt">${esc(q.q || '(question orale)')}</div><div class="hosta">Réponse : <b>${esc(q.a || '—')}</b></div>
        <div class="row"><button class="btn primary" ${!q.a || L.ans ? 'disabled' : ''} onclick="act('reveal')">👁 Révéler la réponse <kbd>Entrée</kbd></button></div>
        <h3 class="mt2" style="font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.07em">Qui a trouvé ?</h3>
        ${moTurnTeam(c) ? `<div class="small mut" style="margin-bottom:6px">Au tour de <b style="color:${moTurnTeam(c).color}">${moTurnPlayer(c) ? esc(moTurnPlayer(c)) + ' · ' : ''}${esc(moTurnTeam(c).name)}</b></div><div class="row"><button class="btn green lg" onclick="moWin('${moTurnTeam(c).id}')">✅ ${esc(moTurnTeam(c).name)} +${o.pts}</button></div><div class="small mut mt">Une autre équipe a trouvé :</div><div class="row">${teams().filter(t => t.id !== moTurnTeam(c).id).map(t => `<button class="btn sm tb" style="--c:${t.color}" onclick="moWin('${t.id}')">${esc(t.name)} +${o.pts}</button>`).join('')}</div>`
          : `<div class="row">${teams().map(t => `<button class="btn tb lg" style="--c:${t.color}" onclick="moWin('${t.id}')">✅ ${esc(t.name)} +${o.pts}</button>`).join('')}</div>`}
        <div class="row mt"><button class="btn red" onclick="moWin('none')">❌ Personne</button><button class="btn ghost" onclick="moClose()">↩ Retour à la grille sans marquer <kbd>⌫</kbd></button></div>`;

    return `<div class="info" style="margin-bottom:8px">🎯 Au tour de <b style="color:${tt ? tt.color : 'inherit'}">${tp ? esc(tp) + '</b> (' + esc(tt ? tt.name : '') + ')' : esc(tt ? tt.name : '') + '</b>'} de choisir une question. <span class="small mut">Ordre : ${ord.map((id, i) => (i + 1) + '. ' + esc((teamById(id) || {}).name || '') + (moPlayers(g, id).length > 1 ? ' (' + moPlayers(g, id).map(esc).join(' → ') + ')' : '')).join(' · ')}</span></div>
      <div class="row" style="margin-bottom:8px"><span class="small mut">Changer la main :</span>${ord.map(id => { const t = teamById(id); return `<button class="btn sm tb ${tt && tt.id === id ? 'sel' : ''}" style="--c:${t.color}" onclick="moSetTurn('${id}')">${esc(t.name)}</button>`; }).join('')}</div>
      <div class="small mut" style="margin-bottom:8px">Clique sur une case pour afficher la question en grand sur la TV. Après « trouvé » ou « personne », la main passe à l’équipe suivante.</div>
      <div class="mg" style="grid-template-columns:repeat(${it.themes.length},1fr)">${it.themes.map(th => `<div class="mh" title="${esc(th.name)}">${esc(th.name)}</div>`).join('')}
      ${rows.map(r => it.themes.map((th, ti) => { const k = `${ti}-${r.li}-${r.k}`, d = L.done[k], tm = d && d !== 'none' ? teamById(d) : null;

/* ---- PointsDrop ---- */
const LET = 'ABCDEFGH';
function dropGL(g){ const gl = gameLive(g, () => ({cap:{}, finished:false})); teams().forEach(t => { if(gl.cap[t.id] === undefined) gl.cap[t.id] = Number(g.opts.capital) || 0; }); return gl; }
function dropMode(g){ return g.opts.playMode || 'all'; }
function dropPer(g){ return Math.max(1, Math.round(Number(g.opts.perTeam) || 3)); }
// équipes qui participent au jeu (toutes / les 2 du duel / l'ordre de passage)
function dropPart(g){
  const ids = teams().map(t => t.id), m = dropMode(g);
  if(m === 'duel'){ let d = (g.opts.duelTeams || []).filter(id => ids.includes(id)); if(d.length < 2) d = d.concat(ids.filter(id => !d.includes(id))).slice(0, 2); return d.slice(0, 2).map(teamById); }
  if(m === 'seq'){ let o = (g.opts.order || []).filter(id => ids.includes(id)); if(!o.length) o = ids; return o.map(teamById); }
  return teams();
}
function dropSeq(g, ii){ if(dropMode(g) !== 'seq') return null; const per = dropPer(g); return {team:dropPart(g)[Math.floor(ii / per)] || null, k:ii % per, per}; }
// équipes qui jouent cette question
function dropActive(g, ii){ const q = dropSeq(g, ii); return q ? (q.team ? [q.team] : []) : dropPart(g); }
function dropMax(g, it){ return Math.max(1, Math.min(Number(g.opts.maxSplit) || 3, it.props.length - 1)); }
function dropCheck(c, tid){
  const gl = dropGL(c.g), cap = Number(c.L.revealed && c.L.before ? c.L.before[tid] : gl.cap[tid]) || 0;
  const b = (c.L.bets[tid] || []).map(x => Number(x) || 0), sum = b.reduce((a, x) => a + x, 0), nz = b.filter(x => x > 0).length;
  if(cap <= 0) return {ok:true, out:true, msg:'éliminée', sum, cap};
  if(c.it.kind === 'double'){ if(nz === 0) return {ok:false, msg:'pas encore misé', sum, cap}; return {ok:nz === 1 && sum === cap, msg:nz > 1 ? 'tout sur UNE case' : `${sum} / ${cap}`, sum, cap}; }
  const mx = dropMax(c.g, c.it);
  if(sum !== cap) return {ok:false, msg:`misé ${sum} / ${cap}`, sum, cap};
  if(nz > mx) return {ok:false, msg:`${mx} cases max`, sum, cap};
  return {ok:true, msg:'OK', sum, cap};
}
function dropStatus(c, tid){
  const k = dropCheck(c, tid);
  if(c.L.revealed){ const now = dropGL(c.g).cap[tid] || 0; return `<span class="tag ${now > 0 ? 'ok' : ''}">→ ${now} pts</span>`; }
  if(k.out) return '<span class="tag">éliminée</span>';
  return `<span class="tag ${k.ok ? 'ok' : ''}">${k.ok ? '✓ ' : ''}${esc(k.msg)}</span>`;
}
function dropDoReveal(c){
  if(c.L.revealed) return false;
  const gl = dropGL(c.g);
  const act = dropActive(c.g, c.ii);
  if(!act.length){ alert('Aucune équipe n’est prévue pour cette question (vérifie l’ordre de passage dans Préparer).'); return false; }
  const bad = act.filter(t => !dropCheck(c, t.id).ok);
  if(bad.length && !confirm('Mises incomplètes pour : ' + bad.map(t => t.name).join(', ') + '.\nRévéler quand même ? (les points non misés sont perdus)')) return false;
  c.L.before = clone(gl.cap);
  act.forEach(t => { const on = Number((c.L.bets[t.id] || [])[c.it.correct]) || 0; gl.cap[t.id] = on; });
  c.L.revealed = true; c.L.shown = true;
  return true;
}
T.drop = {
  n:3,
  opts:() => ({timerMode:'item', timer:30, capital:15, maxSplit:3, ratio:1, playMode:'all', duelTeams:[], order:[], perTeam:3}),
  newItem:(g, i) => { const per = dropMode(g) === 'seq' ? dropPer(g) : 3; return (i % per) === per - 1 ? {id:uid(), q:'', props:['',''], correct:0, kind:'double', timer:20} : {id:uid(), q:'', props:['','','',''], correct:0, kind:'split', timer:null}; },
  name:(g, it, i) => { const q = dropSeq(g, i), lab = firstLine(it.q) || (it.kind === 'double' ? 'Tout ou rien' : 'Question ' + ((q ? q.k : i) + 1));
    return q ? (q.team ? q.team.name : '⚠️ sans équipe') + ' · Q' + (q.k + 1) + ' — ' + lab : lab; },
  live:() => ({bets:{}, shown:false, revealed:false, before:null}),
  reveal:c => { if(!c.L.shown) c.L.shown = true; else dropDoReveal(c); },
  hide:c => { if(c.L.revealed){ dropGL(c.g).cap = clone(c.L.before || {}); c.L.revealed = false; } else c.L.shown = false; },
  tv(c){
    const it = c.it, L = c.L, gl = dropGL(c.g), n = it.props.length, act = dropActive(c.g, c.ii), sq = dropSeq(c.g, c.ii);
    const props = it.props.map((p, i) => { const ok = L.revealed && i === Number(it.correct), ko = L.revealed && !ok;
      const chips = L.shown ? act.map(t => { const v = Number((L.bets[t.id] || [])[i]) || 0; return v ? `<span class="dchip" style="--c:${t.color}">${esc(t.name)} · ${v}</span>` : ''; }).join('') : '';
      return `<div class="dprop ${ok ? 'ok' : ''} ${ko ? 'ko' : ''}" ${L.revealed ? `data-rid="dp${it.id}${i}${ok}"` : (L.shown ? `data-rid="ds${it.id}${i}"` : '')}><div class="dl">${LET[i]}</div><div class="dt">${esc(p || '—')}</div><div class="dbets">${chips}</div></div>`; }).join('');
    const head = (sq && sq.team ? `<div class="tpill" style="--c:${sq.team.color}">${esc(sq.team.name)} · question ${sq.k + 1} / ${sq.per}</div>` : '') + (it.kind === 'double' ? '<div class="mval">Tout ou rien</div>' : '');
    const body = `${head ? `<div class="row" style="display:flex;gap:18px;align-items:center">${head}</div>` : ''}<div class="qcard" style="font-size:50px;padding:30px 54px">${esc(it.q || 'Question')}</div><div class="dprops ${n === 3 ? 'n3' : ''}">${props}</div>`;
 const part = dropPart(c.g), playing = act.map(t => t.id);
    const bar = `<div class="scores ${part.length > 4 ? 'many' : ''}">${part.map(t => { const now = gl.cap[t.id] || 0, was = L.before && playing.includes(t.id) ? L.before[t.id] : undefined;
      return `<div class="sc ${now <= 0 ? 'out' : ''} ${sq && playing.includes(t.id) ? 'hand' : ''}" style="--c:${t.color}" data-rid="dc${t.id}_${now}"><div class="nm">${esc(t.name)}</div><div class="pt">${now}</div><div class="ex"><span class="cap">${L.revealed && was !== undefined ? 'capital : ' + was + ' → ' + now : 'capital'}</span></div></div>`; }).join('')}</div>`;
    return frame(c, {body, bar});
  },
  ctrl(c){
    const it = c.it, L = c.L, gl = dropGL(c.g), dbl = it.kind === 'double', n = it.props.length, act = dropActive(c.g, c.ii), sq = dropSeq(c.g, c.ii);
    const ratio = isNaN(Number(c.g.opts.ratio)) ? 1 : Number(c.g.opts.ratio);
    const rows = act.map(t => { const k = dropCheck(c, t.id), b = L.bets[t.id] || [];
      let cells;
      if(k.out && !L.revealed) cells = '<span class="small mut">plus de points</span>';
      else if(dbl) cells = it.props.map((p, i) => `<button class="btn sm ${Number(b[i]) > 0 ? 'primary' : ''}" ${L.revealed ? 'disabled' : ''} onclick="dropAllIn('${t.id}',${i})">${LET[i]}</button>`).join('');
      else cells = it.props.map((p, i) => `<label class="dinp"><span>${LET[i]}</span><input type="number" min="0" id="db_${it.id}_${t.id}_${i}" value="${Number(b[i]) || ''}" placeholder="0" ${L.revealed ? 'disabled' : ''} oninput="dropBet('${t.id}',${i},this.value)"></label>`).join('');
      return `<div class="lrow"><span class="btn sm tb" style="--c:${t.color};pointer-events:none;min-width:120px;justify-content:flex-start">${esc(t.name)}</span><span class="small" style="min-width:76px;font-weight:800">💰 ${L.revealed ? `${k.cap} → <b style="font-size:15px">${gl.cap[t.id] || 0}</b>` : k.cap}</span><div class="row nw grow">${cells}</div><span id="dv_${t.id}">${dropStatus(c, t.id)}</span></div>`; }).join('');
    return `${sq ? `<div class="small mut">Équipe qui joue cette série :</div><div class="row" style="margin-bottom:8px">${teams().map(t => `<button class="btn sm tb ${sq.team && sq.team.id === t.id ? 'sel' : ''}" style="--c:${t.color}" onclick="dropSeriesTeam('${t.id}')">${esc(t.name)}</button>`).join('')}</div>` : ''}${sq ? (sq.team ? `<div class="info" style="margin-bottom:8px">🎯 Au tour de <b>${esc(sq.team.name)}</b> — question ${sq.k + 1} / ${sq.per}</div>` : `<div class="info warn" style="margin-bottom:8px">Aucune équipe prévue pour cette question : ajoute une équipe à l’ordre de passage ou supprime cette question (mode Préparer).</div>`) : ''}
      <div class="hostq">${esc(it.q || '(question orale)')}</div>
      <div class="hosta">Bonne réponse : <b>${LET[it.correct] || '?'} — ${esc(it.props[it.correct] || '')}</b></div>
      <div class="info small" style="margin-bottom:8px">${dbl ? '🎲 <b>Tout ou rien</b> : l’équipe mise tout son capital sur UNE proposition. Bonne réponse = elle garde son capital (ajouté au score à la fin), mauvaise réponse = 0.' : `Chaque équipe répartit <b>tout</b> son capital sur <b>${dropMax(c.g, it)} propositions maximum</b>. Elle garde uniquement ce qu’elle a misé sur la bonne réponse.`}</div>
      ${rows}
      <div class="row mt"><button class="btn ${L.shown ? '' : 'primary'}" ${L.revealed ? 'disabled' : ''} onclick="dropToggle()">${L.shown ? '🙈 Cacher les mises' : '👁 Afficher les mises sur la TV'} ${L.shown ? '' : '<kbd>Entrée</kbd>'}</button>
        ${L.revealed ? `<button class="btn" onclick="act('hide')">↩ Annuler la révélation</button>` : `<button class="btn green lg" onclick="dropRevealBtn()">✅ Révéler la bonne réponse ${L.shown ? '<kbd>Entrée</kbd>' : ''}</button>`}</div>
      <div class="sep"></div>
      <div class="small mut" style="margin-bottom:6px">Capitaux actuels : ${dropPart(c.g).map(t => `<b style="color:${t.color}">${esc(t.name)} ${gl.cap[t.id] || 0}</b>`).join(' · ')}</div>
      <div class="row"><button class="btn gold" onclick="dropFinish()">🏁 Fin du jeu : ajouter au score → ${dropPart(c.g).map(t => esc(t.name) + ' +' + Math.round((gl.cap[t.id] || 0) * ratio)).join(', ')}</button>${gl.finished ? '<span class="tag ok">déjà ajouté</span>' : ''}<button class="btn sm ghost" onclick="dropResetGame()">↺ Recommencer tout le jeu</button></div>`;
  },
  edit(g, gi){
    const P = `games.${gi}`;
    const m = dropMode(g), duel = dropPart(g).map(t => t.id), order = (g.opts.order || []).filter(id => teamById(id));
    const seqList = m !== 'seq' ? '' : order.concat(teams().map(t => t.id).filter(id => !order.includes(id))).map(id => { const t = teamById(id), on = order.includes(id), pos = order.indexOf(id);
      return `<div class="lrow"><label class="chk" style="margin:0;min-width:34px"><input type="checkbox" ${on ? 'checked' : ''} onchange="dropInc(${gi},'${id}',this.checked)"></label><span style="font-weight:900;min-width:26px">${on ? pos + 1 + '.' : ''}</span><span class="btn sm tb" style="--c:${t.color};pointer-events:none">${esc(t.name)}</span><div class="grow"></div>
        ${on ? `<button class="btn sm ghost" ${pos === 0 ? 'disabled' : ''} onclick="dropOrd(${gi},'${id}',-1)">↑</button><button class="btn sm ghost" ${pos === order.length - 1 ? 'disabled' : ''} onclick="dropOrd(${gi},'${id}',1)">↓</button>` : '<span class="small mut">ne joue pas</span>'}</div>`; }).join('');
    const need = order.length * dropPer(g);
    const modeCard = `<div class="card"><h3>Comment on joue ?</h3>
      <div class="row">${[['all','Toutes les équipes en même temps'],['duel','En duel (2 équipes)'],['seq','Une équipe après l’autre']].map(([k, l]) => `<button class="btn ${m === k ? 'primary' : ''}" onclick="dropSetMode(${gi},'${k}')">${l}</button>`).join('')}</div>
      ${m === 'all' ? '<p class="small mut">Toutes les équipes misent en même temps sur les mêmes questions.</p>' : ''}
      ${m === 'duel' ? `<p class="small mut">Choisis les 2 équipes du duel. Elles misent en même temps sur les mêmes questions.</p><div class="row">${teams().map(t => `<button class="btn tb ${duel.includes(t.id) ? 'sel' : ''}" style="--c:${t.color}" onclick="dropDuel(${gi},'${t.id}')">${esc(t.name)}</button>`).join('')}</div>` : ''}
      ${m === 'seq' ? `<p class="small mut">Chaque équipe joue <b>seule</b> sa série de questions, dans cet ordre (décoche une équipe qui ne joue pas) :</p>${seqList}
        <div class="g2 mt"><div><label class="fl" for="f_${P}.opts.perTeam">Questions par équipe</label><input id="f_${P}.opts.perTeam" type="number" min="1" max="10" data-num data-rr data-p="${P}.opts.perTeam" value="${dropPer(g)}"></div>
        <div style="align-self:end">${g.items.length !== need ? `<button class="btn primary" onclick="dropBuild(${gi})">Ajuster à ${need} questions (${order.length} × ${dropPer(g)})</button>` : `<span class="tag ok">✓ ${need} questions : ${order.length} équipes × ${dropPer(g)}</span>`}</div></div>
        <p class="small mut">Dans chaque série, la dernière question est créée en « tout ou rien » (modifiable). Ci-dessous, chaque question indique l’équipe qui la joue.</p>` : ''}</div>`;
    return modeCard + `<div class="card"><h3>Règles</h3><div class="g3"><div>${fNum(P + '.opts.capital', g.opts.capital, 'Capital de départ par équipe')}</div><div>${fNum(P + '.opts.maxSplit', g.opts.maxSplit, 'Nb max de propositions où miser')}</div><div>${fNum(P + '.opts.ratio', g.opts.ratio, 'Capital final → score (×)')}</div></div>
      <p class="small mut">À la fin, le capital restant de chaque équipe est ajouté à son score (multiplié par le coefficient : 1 = tel quel, 0 = rien).</p></div>` +
      g.items.map((it, ii) => itemCard(g, gi, it, ii, `
      ${fText(`${P}.items.${ii}.q`, it.q, 'Question', '', true)}
      <div class="g2"><div><label class="fl">Type de question</label><select data-p="${P}.items.${ii}.kind" data-rr><option value="split" ${it.kind !== 'double' ? 'selected' : ''}>Répartition des points</option><option value="double" ${it.kind === 'double' ? 'selected' : ''}>Tout ou rien (tout sur une case)</option></select></div>
        <div>${tMode(g) === 'item' ? fNum(`${P}.items.${ii}.timer`, it.timer, 'Chrono de cette question (s)', 'par défaut : ' + (g.opts.timer || 0)) : ''}</div></div>
      <label class="fl">Propositions (coche la bonne réponse)</label>
      ${it.props.map((pr, i) => `<div class="mq" style="grid-template-columns:40px 1fr 170px"><div class="lbl" style="font-size:16px">${LET[i]}</div><input id="f_${P}.items.${ii}.props.${i}" data-p="${P}.items.${ii}.props.${i}" value="${esc(pr)}" placeholder="Proposition ${LET[i]}"><label class="chk" style="margin:0"><input type="radio" name="cor_${it.id}" ${Number(it.correct) === i ? 'checked' : ''} onchange="setCorrect(${gi},${ii},${i},'correct')">bonne réponse</label></div>`).join('')}
      <div class="row mt"><button class="btn sm" onclick="dropProps(${gi},${ii},1)" ${it.props.length >= 4 ? 'disabled' : ''}>＋ proposition</button><button class="btn sm" onclick="dropProps(${gi},${ii},-1)" ${it.props.length <= 2 ? 'disabled' : ''}>− proposition</button></div>`)).join('') + addItemBtn(gi, '＋ Ajouter une question');
  }
};

/* ---- L'intrus ---- */
function intValid(it){ return it.props.map((p, i) => i).filter(i => String(it.props[i] || '').trim()); }
T.intrus = {
  n:1,
  opts:() => ({timerMode:'item', timer:15, ptsGood:1, ptsLose:0, ptsOthers:2}),
  newItem:() => ({id:uid(), statement:'', props:Array(10).fill(''), intrus:0}),
  name:(g, it, i) => firstLine(it.statement) || 'Manche ' + (i + 1),
  live:sl => ({removed:{}, turn:(sl && sl.g ? gStarter(sl.g, sl.ii) : null) || (S.doc.teams[0] || {}).id, lost:null, done:false, showIntrus:false}),
  reveal:c => { c.L.showIntrus = true; },
  hide:c => { c.L.showIntrus = false; },
  tv(c){
    const it = c.it, L = c.L, idx = intValid(it), half = Math.ceil(idx.length / 2);
    const cards = idx.map((i, k) => { const rm = L.removed[i], tm = rm ? teamById(rm) : null, isInt = i === Number(it.intrus) && (L.showIntrus || L.lost);
      return `<div class="ip ${rm ? 'rm' : ''} ${isInt ? 'int' : ''}" ${tm ? `style="--c:${tm.color}"` : ''} ${rm || isInt ? `data-rid="ip${it.id}${i}${rm || 'x'}"` : ''}><div class="in">${k + 1}</div><div class="it2">${esc(it.props[i])}</div>${tm ? `<div class="iw">✔ ${esc(tm.name)}</div>` : isInt ? '<div class="iw">INTRUS</div>' : ''}</div>`; }).join('');
    let banner = '';
    if(L.lost && teamById(L.lost)) banner = `<div class="ans red" data-rid="il${it.id}">${esc(teamById(L.lost).name)} tombe sur l’intrus !</div>`;
    else if(L.done) banner = `<div class="ans gold" data-rid="id${it.id}">Toutes les bonnes réponses ont été trouvées !</div>`;
    const body = `<div class="h1 tsh" style="font-size:56px">${esc(it.statement || 'L’intrus')}</div><div class="ig" style="grid-template-rows:repeat(${half},1fr)">${cards}</div>${banner}`;
    const ended = L.lost || L.done;
    return frame(c, {body, hand:ended ? null : L.turn, turn:ended ? null : L.turn, extras:t => (!ended && t.id === L.turn ? '<span class="tg">à vous</span>' : ''), outIf:t => t.id === L.lost});
  },
  ctrl(c){
    const it = c.it, L = c.L, ended = L.lost || L.done, turn = teamById(L.turn);
    return `<div class="hostq">${esc(it.statement || '(affirmation)')}</div>
      <div class="small mut">Au tour de :</div>
      <div class="row">${teams().map(t => `<button class="btn sm tb ${L.turn === t.id ? 'sel' : ''}" style="--c:${t.color}" onclick="intTurn('${t.id}')">${esc(t.name)}</button>`).join('')}</div>
      <div class="small mut mt">Clique sur la proposition choisie par <b>${esc(turn ? turn.name : '')}</b> :</div>
      <div class="mt">${intValid(it).map((i, k) => { const rm = L.removed[i], tm = rm ? teamById(rm) : null, isInt = i === Number(it.intrus);
        return `<div class="ans-row ${rm ? 'on' : ''}"><div class="n">${k + 1}</div><div><b>${esc(it.props[i])}</b> ${isInt ? '<span class="tag">intrus</span>' : ''} ${tm ? `<span class="tag ok">retirée par ${esc(tm.name)}</span>` : ''}</div><div></div>
          <button class="btn sm ${isInt ? 'red' : 'green'}" ${rm || ended ? 'disabled' : ''} onclick="intPick(${i})">Choisie</button></div>`; }).join('')}</div>
      ${L.lost ? `<div class="info warn mt">😱 <b>${esc((teamById(L.lost) || {}).name || '')}</b> est tombée sur l’intrus. Pour annuler : <kbd>⌘</kbd>+<kbd>Z</kbd></div>` : ''}
      <div class="row mt"><button class="btn" onclick="act('${L.showIntrus ? 'hide' : 'reveal'}')">${L.showIntrus ? '🙈 Cacher l’intrus' : '👁 Montrer l’intrus sur la TV'}</button><button class="btn sm ghost" onclick="intReset()">↺ Recommencer la manche</button></div>
      <p class="small mut">Points : +${esc(c.g.opts.ptsGood)} par bonne réponse retirée${Number(c.g.opts.ptsLose) ? ', −' + esc(c.g.opts.ptsLose) + ' pour l’équipe qui tombe sur l’intrus' : ''}${Number(c.g.opts.ptsOthers) ? ', +' + esc(c.g.opts.ptsOthers) + ' pour chacune des autres équipes à ce moment-là' : ''}. Chaque clic s’annule avec <kbd>⌘</kbd>+<kbd>Z</kbd>.</p>`;
  },
  edit(g, gi){
    const P = `games.${gi}`;
    return `<div class="card"><h3>Points</h3><div class="g3"><div>${fNum(P + '.opts.ptsGood', g.opts.ptsGood, 'Par bonne réponse retirée')}</div><div>${fNum(P + '.opts.ptsLose', g.opts.ptsLose, 'Retirés à l’équipe qui tombe sur l’intrus')}</div><div>${fNum(P + '.opts.ptsOthers', g.opts.ptsOthers, 'Pour chaque autre équipe quand l’intrus tombe')}</div></div>
      <p class="small mut">Avec « un chrono par question », le chrono repart à chaque changement d’équipe (chrono par tour).</p></div>` +
      g.items.map((it, ii) => itemCard(g, gi, it, ii, `
      ${fText(`${P}.items.${ii}.statement`, it.statement, 'Affirmation (ex : « Ces joueurs ont gagné la Ligue des champions »)', '', true)}
      <label class="fl">Propositions (coche l’intrus — laisse vide pour en avoir moins de 10)</label>
      ${it.props.map((pr, i) => `<div class="mq" style="grid-template-columns:40px 1fr 120px"><div class="lbl">${i + 1}</div><input id="f_${P}.items.${ii}.props.${i}" data-p="${P}.items.${ii}.props.${i}" value="${esc(pr)}" placeholder="Proposition ${i + 1}"><label class="chk" style="margin:0"><input type="radio" name="int_${it.id}" ${Number(it.intrus) === i ? 'checked' : ''} onchange="setCorrect(${gi},${ii},${i},'intrus')">intrus</label></div>`).join('')}`)).join('') + addItemBtn(gi, '＋ Ajouter une manche');
  }
};

/* ---- Jeux « première bonne réponse » (Petit Bac, Lettres dans le désordre) ---- */
function brLive(){ return {wrong:{}, winner:null, none:false, ans:false}; }
function brBanner(c, extra){
  const L = c.L, w = teamById(L.winner);
  if(w) return `<div class="ans gold" data-rid="bw${c.it.id}${w.id}">${esc(w.name)} : +${ptsTxt(Number(c.g.opts.pts) || 0)}${extra ? `<span class="by">${esc(extra)}</span>` : ''}</div>`;
  if(L.none) return `<div class="ans red" data-rid="bn${c.it.id}">Personne n’a trouvé${extra ? `<span class="by">${esc(extra)}</span>` : ''}</div>`;
  return '';
}
function brFrame(c, body){ const L = c.L; return frame(c, {body, hand:L.winner, extras:t => L.wrong[t.id] ? '<span class="e">✖</span>' : '', outIf:t => !!L.wrong[t.id]}); }
function brCtrl(c){

/* ---- Les lettres dans le désordre ---- */
function hashStr(str){ let h = 2166136261; for(const ch of str){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function shuffleArr(a, r){ a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const cleanName = x => String(x || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z\- ]/g, '').replace(/\s+/g, ' ').trim();
// mélange déterministe : la régie et la TV affichent toujours le même ordre
function anaWords(it, perWord){
  const words = cleanName(it.answer).split(/[ \-]+/).filter(Boolean);
  const right = words.map(w => w.split(''));
  if(!words.length) return {mixed:[], right};
  const own = cleanName(it.custom || '').replace(/[^A-Z]/g, '');
  if(own) return {mixed:[own.split('')], right};
  const plain = perWord ? words.join(' ') : words.join('');
  let mixed = right;
  for(let k = 0; k < 15; k++){
    const r = rng(hashStr(it.id + '|' + words.join(' ') + '|' + (it.seed || 0) + '|' + k));
    mixed = perWord ? words.map(w => shuffleArr(w.split(''), r)) : [shuffleArr(words.join('').split(''), r)];
    if(mixed.map(x => x.join('')).join(perWord ? ' ' : '') !== plain) break;
  }
  return {mixed, right};
}
function tilesHTML(groups, cls, rid){
  const n = groups.reduce((a, g) => a + g.length, 0) + Math.max(0, groups.length - 1);
  const size = clamp(Math.floor(1720 / Math.max(n, 1)) - 12, 62, 150);
  return `<div class="tiles" style="--ts:${size}px">${groups.map((g, gi) => `<div class="tw">${g.map((ch, i) => `<div class="tile ${cls}" ${rid ? `data-rid="${rid}${gi}_${i}"` : ''}>${esc(ch)}</div>`).join('')}</div>`).join('')}</div>`;
}

function recapData(){
  const ts = teams(), hist = S.live.history || [], rows = [], idx = {};
  const order = []; S.doc.games.forEach(g => { const k = grpKey(g); if(!order.includes(k)) order.push(k); });
  hist.forEach(h => { const k = h.gid && S.doc.games.some(g => g.id === h.gid) ? h.gid : '_autre'; if(!idx[k]){ idx[k] = {key:k, pts:{}}; } idx[k].pts[h.teamId] = (idx[k].pts[h.teamId] || 0) + (Number(h.delta) || 0); });
  order.forEach(k => { if(idx[k] && Object.values(idx[k].pts).some(v => v)) rows.push({key:k, label:grpLabel(k), icon:grpIcon(k), pts:idx[k].pts}); });
  const adj = {}; ts.forEach(t => { const sum = rows.reduce((a, r) => a + (r.pts[t.id] || 0), 0); adj[t.id] = t.score - sum; });
  if(ts.some(t => adj[t.id])) rows.push({key:'_adj', label:'Autres / ajustements', icon:'✏️', pts:adj});
  const mt = []; S.doc.games.filter(g => g.type === 'money').forEach(g => moStats(g).forEach(x => mt.push(x)));
  const mtTeams = {}; mt.forEach(x => { mtTeams[x.tid] = mtTeams[x.tid] || {good:0, total:0}; mtTeams[x.tid].good += x.good; mtTeams[x.tid].total += x.total; });
  mt.sort((a, b) => b.good - a.good || (b.good / (b.total || 1)) - (a.good / (a.total || 1)) || a.player.localeCompare(b.player));
  const faf = {}; S.doc.games.filter(g => g.type === 'pick').forEach(P => pkCover(P).forEach(k => { const r = rows.find(x => x.key === k); ts.forEach(t => { const n = pickName(S.doc.games.find(g => g.id === k), t.id); if(!n) return; const key = t.id + '|' + n; faf[key] = faf[key] || {tid:t.id, player:n, pts:0, games:0}; faf[key].games++; faf[key].pts += r ? (r.pts[t.id] || 0) : 0; }); }));
  const fafL = Object.values(faf).sort((a, b) => b.pts - a.pts);
  return {ts, rows, mt, mtTeams, faf:fafL};
}
