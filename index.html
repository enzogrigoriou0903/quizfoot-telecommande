const SEASON_KEY = 'quizfoot_season';
const SEASON_SEED = [['SAM',4,4],['ACHIM',3,5],['SACHA.S',1,1],['JOEY',1,3],['BEN',1,2],['SEB',1,2],['JORDANE',1,4],['SACHA.G',1,5],['YOHAN MECHIN',0,2],['YOHAN GRIG',0,5]];
function seasonGet(){ let d = null; try{ d = JSON.parse(localStorage.getItem(SEASON_KEY) || 'null'); }catch(e){}
  if(!d || !Array.isArray(d.players)){ d = {name:'Saison 2026-2027', players:SEASON_SEED.map(([name, won, played]) => ({id:uid(), name, won, played})), nights:[]}; seasonPut(d); }
  return d; }
function seasonPut(d){ try{ localStorage.setItem(SEASON_KEY, JSON.stringify(d)); }catch(e){} try{ S.live.seasonRev = Date.now(); }catch(e){} }
function seasonSorted(d){ return [...(d || seasonGet()).players].sort((a, b) => (b.won - a.won) || ((b.played ? b.won / b.played : 0) - (a.played ? a.won / a.played : 0)) || (a.played - b.played) || String(a.name).localeCompare(String(b.name))); }
function seasonMatch(d, name){ const n = norm(name); if(!n) return null; const ex = d.players.find(p => norm(p.name) === n); if(ex) return ex;
  const w = n.split(' '); const c = d.players.filter(p => { const pw = norm(p.name).split(' '); return pw[0] === w[0] && w.slice(1).every((x, i) => pw[i + 1] && pw[i + 1].startsWith(x)) && pw.length >= w.length; });
  if(c.length === 1) return c[0]; const c2 = d.players.filter(p => norm(p.name).split(' ')[0] === w[0]); return c2.length === 1 && w.length === 1 ? c2[0] : null; }
function seasonHTML(c){
  const d = seasonGet(), L = seasonSorted(d), n = L.length;
  const rows = L.map((p, i) => `<div class="ssr ${i === 0 ? 'first' : ''} ${i === n - 1 && n > 2 ? 'last' : ''}"><div class="ssp">${i + 1}</div><div class="ssn">${esc(p.name)}</div><div class="ssw">${p.won}</div><div class="ssj">${p.played}</div></div>`).join('');
  const body = `<div class="ss"><div class="ss-t">Classement</div><div class="ss-s">${esc(d.name || 'Saison')}</div>
    <div class="ssr head"><div></div><div class="ssn">Nom</div><div class="ssw">🏆 Quiz gagnés</div><div class="ssj">⚽ Quiz joués</div></div>${rows}</div>`;
  return c ? frame(c, {body, scores:false, cls:'stretch'}) : `<div class="sl noscores"><div class="chip">🏆 Saison</div><div class="body stretch"><div class="fit">${body}</div></div></div>`;
}
T.season = {
  single:true,
  tv(c){ return seasonHTML(c); },
  ctrl(){ return `<div class="info">🏆 Le classement de la saison : d’abord le nombre de quiz gagnés, puis le meilleur pourcentage de victoires.</div>
    <div class="row mt"><button class="btn gold" onclick="seasonOpenSave()">🏆 Enregistrer la soirée</button><button class="btn" onclick="seasonPNG()">🖼️ Enregistrer en image</button><button class="btn ghost" onclick="setMode('prep');selPanel('season')">✏️ Modifier la saison</button></div>${S.live.nightSaved ? '<div class="small mut mt">✅ Cette soirée est déjà enregistrée.</div>' : ''}`; },
  edit(){ return `<div class="info">Le classement vient de l’onglet <b>🏆 Championnat</b> (en haut à gauche). Rien à préparer ici.</div>`; }
};
function seasonOpenSave(){ UI.saveNight = true; renderRegie(); }
function seasonSaveHTML(){
  const d = seasonGet(), ts = [...teams()].sort((a, b) => b.score - a.score), top = ts.length ? ts[0].score : 0;
  UI.snWin = UI.snWin || Object.fromEntries(teams().map(t => [t.id, t.score === top && top > 0]));
  const opts = (name) => { const m = seasonMatch(d, name); return `<option value="__new">➕ Nouveau joueur : ${esc(name)}</option>${d.players.map(p => `<option value="${p.id}" ${m && m.id === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="__skip">Ne pas compter</option>`; };
  return `<div class="modal" onclick="if(event.target===this){UI.saveNight=false;renderRegie()}"><div class="box" style="max-width:760px"><h2>🏆 Enregistrer la soirée dans la saison</h2>
    ${S.live.nightSaved ? '<div class="info warn">⚠ Cette soirée a déjà été enregistrée. L’enregistrer à nouveau la compterait deux fois.</div>' : ''}
    <p class="small mut">Coche l’équipe gagnante, puis vérifie que chaque joueur correspond au bon nom du classement.</p>
    ${ts.map(t => `<div class="snt" style="border-left:6px solid ${t.color}"><label class="chk" style="margin:0"><input type="checkbox" ${UI.snWin[t.id] ? 'checked' : ''} onchange="UI.snWin['${t.id}']=this.checked"><b>${esc(t.name)}</b> · ${t.score} pts ${UI.snWin[t.id] ? '🏆' : ''}</label>
      ${pkPlayers(t).map(n => `<div class="snp"><span>${esc(n)}</span><select data-snp="${t.id}|${esc(n)}">${opts(n)}</select></div>`).join('') || '<div class="small mut">Aucun joueur : ajoute-les dans Équipes.</div>'}</div>`).join('')}
    <div class="row mt2"><button class="btn gold lg" onclick="seasonDoSave()">✅ Enregistrer</button><button class="btn lg" onclick="UI.saveNight=false;renderRegie()">Annuler</button></div></div></div>`;
}
function seasonDoSave(){
  const d = seasonGet(), entries = [];
  document.querySelectorAll('[data-snp]').forEach(sel => { const [tid, ...rest] = sel.dataset.snp.split('|'); const name = rest.join('|'); const v = sel.value; if(v === '__skip') return;
    let p = v === '__new' ? null : d.players.find(x => x.id === v); if(!p){ p = {id:uid(), name:name.toUpperCase(), won:0, played:0}; d.players.push(p); }
    if(entries.some(e => e.id === p.id)) return; const won = !!UI.snWin[tid]; p.played++; if(won) p.won++; entries.push({id:p.id, name:p.name, won}); });
  if(!entries.length){ toast('Aucun joueur à enregistrer'); return; }
  d.nights.push({id:uid(), date:new Date().toISOString(), quiz:S.doc.name || '', entries}); seasonPut(d);
  S.live.nightSaved = d.nights[d.nights.length - 1].id; UI.saveNight = false; UI.snWin = null; toast('🏆 Soirée enregistrée dans la saison'); commit();
}
function seasonUndoLast(){ const d = seasonGet(), n = d.nights[d.nights.length - 1]; if(!n) return; if(!confirm('Annuler la dernière soirée enregistrée (' + new Date(n.date).toLocaleDateString('fr-FR') + ') ?')) return;
  n.entries.forEach(e => { const p = d.players.find(x => x.id === e.id); if(p){ p.played = Math.max(0, p.played - 1); if(e.won) p.won = Math.max(0, p.won - 1); } }); d.nights.pop(); seasonPut(d); if(S.live.nightSaved === n.id) S.live.nightSaved = null; commit(); }
function seasonSet(id, k, v){ const d = seasonGet(), p = d.players.find(x => x.id === id); if(!p) return; p[k] = k === 'name' ? String(v).toUpperCase() : Math.max(0, Number(v) || 0); if(k !== 'name' && p.won > p.played && k === 'won') p.played = p.won; seasonPut(d); commit(); }
function seasonAdd(){ const d = seasonGet(); d.players.push({id:uid(), name:'NOUVEAU', won:0, played:0}); seasonPut(d); commit(); }
function seasonDel(id){ const d = seasonGet(), p = d.players.find(x => x.id === id); if(!p || !confirm('Retirer ' + p.name + ' du classement ?')) return; d.players = d.players.filter(x => x.id !== id); seasonPut(d); commit(); }
function seasonExport(){ const blob = new Blob([JSON.stringify({app:'QuizFootSaison', season:seasonGet()}, null, 1)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'Saison_quiz_foot.json'; a.click(); }
function seasonImport(input){ const f = input.files && input.files[0]; if(!f) return; f.text().then(t => { try{ const o = JSON.parse(t); const d = o.season || o; if(!Array.isArray(d.players)) throw 0; if(!confirm('Remplacer le classement actuel par celui du fichier ?')) return; seasonPut(d); commit(); toast('✅ Saison chargée'); }catch(e){ alert('Fichier de saison invalide'); } }); input.value = ''; }
function seasonPanel(){
  const d = seasonGet(), L = seasonSorted(d);
  return `<div class="card"><h2>🏆 Championnat de la saison</h2>
    <p class="small mut">Classement : d’abord le nombre de quiz gagnés, puis le meilleur pourcentage de victoires. Il est gardé dans ce navigateur : pense à l’exporter de temps en temps (sauvegarde).</p>
    ${fText('__season.name', d.name, 'Nom de la saison').replace('data-p="__season.name"', 'oninput="seasonRename(this.value)"')}
    <table class="sstab"><tr><th>#</th><th>Joueur</th><th>Gagnés</th><th>Joués</th><th>%</th><th></th></tr>
    ${L.map((p, i) => `<tr><td>${i + 1}</td><td><input value="${esc(p.name)}" onchange="seasonSet('${p.id}','name',this.value)"></td><td><input type="number" min="0" value="${p.won}" onchange="seasonSet('${p.id}','won',this.value)"></td><td><input type="number" min="0" value="${p.played}" onchange="seasonSet('${p.id}','played',this.value)"></td><td class="mut">${p.played ? Math.round(p.won / p.played * 100) : 0} %</td><td><button class="btn sm ghost" onclick="seasonDel('${p.id}')">✕</button></td></tr>`).join('')}</table>
    <div class="row mt"><button class="btn" onclick="seasonAdd()">＋ Ajouter un joueur</button><button class="btn" onclick="toggleOverlay('season')">📺 Afficher sur la TV</button><button class="btn" onclick="seasonPNG()">🖼️ Enregistrer en image</button></div>
    <div class="sep"></div><h3>Soirées enregistrées (${d.nights.length})</h3>
    ${d.nights.slice().reverse().map(n => `<div class="small">${new Date(n.date).toLocaleDateString('fr-FR')} · ${esc(n.quiz)} · gagnants : <b>${esc(n.entries.filter(e => e.won).map(e => e.name).join(', ') || '—')}</b> · ${n.entries.length} joueurs</div>`).join('') || '<div class="small mut">Aucune soirée enregistrée depuis le logiciel (les chiffres de départ viennent de ton tableau).</div>'}
    <div class="row mt">${d.nights.length ? '<button class="btn sm red" onclick="seasonUndoLast()">↩ Annuler la dernière soirée</button>' : ''}<button class="btn sm" onclick="seasonExport()">⬇️ Exporter la saison</button><label class="btn sm">⬆️ Charger une saison<input type="file" accept=".json" hidden onchange="seasonImport(this)"></label></div></div>`;
}
function seasonRename(v){ const d = seasonGet(); d.name = v; seasonPut(d); const sl = cur(); if(sl && sl.g.type === 'season') preview.render && preview.render(); tvPushSoon(); }
function tvPushSoon(){ clearTimeout(window._tvps); window._tvps = setTimeout(() => commit(), 400); }

/* ---- Images à partager (PNG) ---- */
function pngSave(cv, name){ const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = name; document.body.appendChild(a); a.click(); a.remove(); toast('🖼️ Image enregistrée dans tes Téléchargements'); }
function pngBase(title, sub){
  const cv = document.createElement('canvas'); cv.width = 1920; cv.height = 1080; const x = cv.getContext('2d');
  const g = x.createLinearGradient(0, 0, 0, 1080); g.addColorStop(0, '#0b1b3f'); g.addColorStop(1, '#13306b'); x.fillStyle = g; x.fillRect(0, 0, 1920, 1080);
  x.fillStyle = '#f5b700'; x.font = '900 96px system-ui, -apple-system, Arial'; x.textAlign = 'center'; x.fillText(title.toUpperCase(), 960, 130);
  if(sub){ x.fillStyle = '#fff'; x.font = '800 34px system-ui, -apple-system, Arial'; x.fillText(sub.toUpperCase(), 960, 185); }
  return [cv, x];
}
function fitText(x, t, w, font, size){ let s = size; do { x.font = `${font} ${s}px system-ui, -apple-system, Arial`; s -= 2; } while(x.measureText(t).width > w && s > 12); return t; }
function recapPNG(){
  const D = recapData(), ts = D.ts, [cv, x] = pngBase('Bilan de la soirée', (S.doc.name || 'Quiz foot') + ' · ' + new Date().toLocaleDateString('fr-FR'));
  const side = D.mt.length ? 520 : 0, X0 = 60, W = 1800 - side - (side ? 40 : 0), c0 = W * 0.36, cw = (W - c0) / Math.max(1, ts.length);
  const rows = D.rows.concat([{label:'TOTAL', icon:'', tot:true}]), rh = Math.min(70, 800 / (rows.length + 1)); let y = 230;
  x.textAlign = 'center'; ts.forEach((t, i) => { x.fillStyle = t.color; x.fillRect(X0 + c0 + i * cw + 6, y, cw - 12, rh - 10); x.fillStyle = '#fff'; fitText(x, t.name, cw - 24, 900, 26); x.fillText(t.name.toUpperCase(), X0 + c0 + i * cw + cw / 2, y + rh / 2 + 5); });
  y += rh;
  rows.forEach((r, ri) => { x.fillStyle = r.tot ? '#f5b700' : (ri % 2 ? 'rgba(255,255,255,.10)' : 'rgba(255,255,255,.18)'); x.fillRect(X0, y, W, rh - 8);
    x.fillStyle = r.tot ? '#0b1b3f' : '#fff'; x.textAlign = 'left'; fitText(x, r.label, c0 - 30, 800, 30); x.fillText((r.icon ? r.icon + ' ' : '') + r.label, X0 + 18, y + rh / 2 + 4);
    x.textAlign = 'center'; ts.forEach((t, i) => { const v = r.tot ? t.score : (r.pts[t.id] || 0); x.font = '900 32px system-ui, -apple-system, Arial'; x.fillText(r.tot ? String(v) : (v ? '+' + v : '–'), X0 + c0 + i * cw + cw / 2, y + rh / 2 + 6); });
    y += rh; });
  if(side){ const sx = 1920 - 60 - side; let sy = 230; x.fillStyle = 'rgba(255,255,255,.95)'; x.fillRect(sx, sy, side, 70 + Math.min(12, D.mt.length) * 52); x.fillStyle = '#0b1b3f'; x.textAlign = 'left'; x.font = '900 34px system-ui, -apple-system, Arial'; x.fillText('💶 MONEY TIME', sx + 24, sy + 48); sy += 70;
    D.mt.slice(0, 12).forEach(m => { const t = teamById(m.tid) || {}; x.fillStyle = t.color || '#888'; x.beginPath(); x.arc(sx + 34, sy + 18, 12, 0, 7); x.fill(); x.fillStyle = '#0b1b3f'; x.textAlign = 'left'; x.font = '800 30px system-ui, -apple-system, Arial'; x.fillText(m.player.toUpperCase(), sx + 60, sy + 28); x.textAlign = 'right'; x.font = '900 30px system-ui, -apple-system, Arial'; x.fillText(m.good + '/' + m.total, sx + side - 24, sy + 28); sy += 52; }); }
  pngSave(cv, 'Bilan_quiz_' + new Date().toISOString().slice(0, 10) + '.png');
}
function seasonPNG(){
  const d = seasonGet(), L = seasonSorted(d), [cv, x] = pngBase('Classement', d.name || 'Saison');
  const X0 = 360, W = 1200, rh = Math.min(74, 820 / (L.length + 1)); let y = 220;

    x.fillStyle = first ? '#0b1b3f' : '#fff'; x.font = '900 40px system-ui, -apple-system, Arial'; x.textAlign = 'center'; x.fillText(String(i + 1), X0 + 55, y + rh / 2 + 12);
    x.textAlign = 'left'; fitText(x, p.name, 560, 900, 40); x.fillText(p.name.toUpperCase(), X0 + 130, y + rh / 2 + 12);

/* ---- Face à face : joueurs désignés ---- */
function grpKey(g){ const gs = S.doc.games; let i = gs.indexOf(g); if(i < 0) return g.id;
  if(g.type === 'slides' && g.tpl !== 'accueil') while(i > 0 && gs[i - 1].type === 'slides' && gs[i - 1].tpl === g.tpl) i--;
  return gs[i].id; }
function grpLabel(key){ const g = S.doc.games.find(x => x.id === key); return g ? String(g.title).split(' · ')[0] : ''; }
function grpIcon(key){ const g = S.doc.games.find(x => x.id === key); return g ? (tplOf(g).icon || '') : ''; }
function pkCandidates(g){ const gs = S.doc.games, gi = gs.indexOf(g), out = [];
  for(let i = gi + 1; i < gs.length; i++){ const x = gs[i]; if(['pick','ranking','winner'].includes(x.type) || x.tpl === 'accueil') continue; const k = grpKey(x); if(!out.includes(k)) out.push(k); }
  return out; }
function pkCover(g){ const cand = pkCandidates(g);
  if(Array.isArray(g.opts.cover)) return cand.filter(k => g.opts.cover.includes(k));
  const out = [], gs = S.doc.games;
  for(const k of cand){ const x = gs.find(y => y.id === k); if(x.type === 'pick') break; out.push(k); if(x.type === 'intrus') break; }
  return out; }
function splitNames(n){ return String(n || '').split('/').map(x => x.trim()).filter(Boolean); }
function pkPlayers(t){ const l = ((t && t.players) || []).map(x => String(x || '').trim()).filter(Boolean); return l.length ? l : splitNames(t && t.name); }
function addPlayer(i){ const t = S.doc.teams[i]; t.players = t.players || []; t.players.push(''); commit(); setTimeout(() => { const el = document.getElementById(`f_teams.${i}.players.${t.players.length - 1}`); if(el) el.focus(); }, 30); }
function delPlayer(i, j){ const t = S.doc.teams[i]; t.players.splice(j, 1); commit(); }
function playersFromName(i){ const t = S.doc.teams[i]; t.players = splitNames(t.name); commit(); }
function pickName(g, tid){ const k = grpKey(g);
  for(const P of S.doc.games){ if(P.type !== 'pick' || !pkCover(P).includes(k)) continue; const L = S.live.items[P.id]; const v = L && L.p && L.p[k] && L.p[k][tid]; if(v) return v; }
  return ''; }
function pickRowHTML(g){ const ts = teams().filter(t => pickName(g, t.id)); if(!ts.length) return '';
  return `<div class="pkrow">${ts.map(t => `<span style="--c:${t.color}">🎯 ${esc(pickName(g, t.id))}</span>`).join('')}</div>`; }
function pkSet(gi, key, tid, name){ const g = S.doc.games[gi], L = liveOf({g}); L.p = L.p || {}; L.p[key] = L.p[key] || {};
  if(L.p[key][tid] === name) delete L.p[key][tid]; else L.p[key][tid] = name; commit(); }
function pkEdit(gi, key, tid){ const g = S.doc.games[gi], L = liveOf({g}); const cur0 = (L.p && L.p[key] && L.p[key][tid]) || ''; const v = prompt('Nom du joueur désigné', cur0); if(v === null) return; L.p = L.p || {}; L.p[key] = L.p[key] || {}; if(v.trim()) L.p[key][tid] = v.trim(); else delete L.p[key][tid]; commit(); }
function pkClear(gi){ if(!confirm('Effacer tous les joueurs désignés ?')) return; const L = liveOf({g:S.doc.games[gi]}); L.p = {}; commit(); }
function pkCoverToggle(gi, key){ const g = S.doc.games[gi]; const cur0 = pkCover(g); g.opts.cover = cur0.includes(key) ? cur0.filter(k => k !== key) : pkCandidates(g).filter(k => cur0.includes(k) || k === key); commit(); }
T.pick = {
  single:true,
  opts:() => ({cover:null}),
  live:() => ({p:{}}),

  ctrl(c){

    return `<div class="info" style="margin-bottom:10px">🎯 Clique sur le joueur choisi par chaque équipe, pour chaque jeu. Les noms apparaissent aussitôt sur la TV, puis sous chaque équipe pendant le jeu. ✏️ pour taper un autre nom.</div>
      ${keys.map(k => `<div class="pkr"><b>${esc(grpIcon(k))} ${esc(grpLabel(k))}</b><div class="pkteams">${ts.map(t => { const v = p[k] && p[k][t.id]; const pl = pkPlayers(t);
        return `<div class="pkteam" style="--c:${t.color}"><span class="pkdot"></span>${pl.map(n => `<button class="btn sm tb ${v === n ? 'sel' : ''}" style="--c:${t.color}" onclick="pkSet(${gi},'${k}','${t.id}',${esc(JSON.stringify(n))})">${esc(n)}</button>`).join('')}${v && !pl.includes(v) ? `<button class="btn sm tb sel" style="--c:${t.color}" onclick="pkSet(${gi},'${k}','${t.id}',${esc(JSON.stringify(v))})">${esc(v)}</button>` : ''}<button class="btn sm ghost" title="Taper un autre nom" onclick="pkEdit(${gi},'${k}','${t.id}')">✏️</button></div>`; }).join('')}</div></div>`).join('')}

let AC = null;
function beep(kind){
  if(IS_TV || IS_REMOTE || !S.doc.settings.sound) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const now = AC.currentTime;
    const tone = (f, t0, d, type, vol) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = type || 'sine'; o.frequency.value = f; o.connect(g); g.connect(AC.destination);
      g.gain.setValueAtTime(0.0001, now + t0); g.gain.exponentialRampToValueAtTime(vol || .15, now + t0 + .015); g.gain.exponentialRampToValueAtTime(0.0001, now + t0 + d); o.start(now + t0); o.stop(now + t0 + d + .03); };
    if(kind === 'good'){ tone(784, 0, .16); tone(1175, .1, .28); }
    else if(kind === 'bad'){ tone(180, 0, .45, 'sawtooth', .12); tone(140, .05, .45, 'square', .05); }
    else if(kind === 'end'){ tone(523, 0, .25); tone(392, .22, .25); tone(262, .44, .6); }
    else if(kind === 'tick'){ tone(1000, 0, .07, 'sine', .1); }
    else tone(700, 0, .2);
  }catch(e){}
}

function rmSend(m){ try{ if(!(RM.conn && RM.conn.open)) return; const txt = JSON.stringify(m), CH_SZ = 12000;
  if(txt.length <= CH_SZ){ RM.conn.send(txt); return; }
  const id = uid(), n = Math.ceil(txt.length / CH_SZ); for(let i = 0; i < n; i++) RM.conn.send(JSON.stringify({type:'chunk', id, i, n, d:txt.slice(i * CH_SZ, (i + 1) * CH_SZ)})); }catch(e){} }

    Object.keys(RM_BUF).forEach(k => { if(Date.now() - RM_BUF[k].t > 30000) delete RM_BUF[k]; });

      if(RM.conn && RM.conn !== conn){ try{ RM.conn.close(); }catch(e){} }
      RM.conn = conn;
      conn.on('open', () => { RM.ok = true; RM.last = Date.now(); rmSend({type:'hello', now:Date.now()}); rmSend({type:'state', rev, state:S}); rmStatus(); toast('📱 Télécommande connectée'); });
      conn.on('data', d => { const m = rmParse(d); RM.last = Date.now(); if(!m) return;
        if(m.type === 'state' && m.state && m.rev > rev){ rev = m.rev; S = m.state; persist(); post({type:'state', rev, state:S}); queueRender(); if(preview) preview.render(); }
        else if(m.type === 'ping') rmSend({type:'pong', now:Date.now()});

function rmStartRemote(){

  loadLib(PEER_LIB, 'Peer').then(P => {
    const connect = () => {
      if(!RM.peer || RM.peer.destroyed){ RM.peer = new P({debug:0}); RM.peer.on('error', () => { RM.ok = false; rmRemoteBar(); setTimeout(connect, 2500); }); RM.peer.on('disconnected', () => { try{ RM.peer.reconnect(); }catch(e){} }); }
      const go2 = () => { const conn = RM.peer.connect(REMOTE_ID, {reliable:true, serialization:'raw'}); RM.conn = conn;
        conn.on('open', () => { RM.ok = true; RM.last = Date.now(); rmSend({type:'need'}); rmRemoteBar(); });
        conn.on('data', d => { const m = rmParse(d); RM.last = Date.now(); if(!m) return;
          if(m.type === 'hello' || m.type === 'pong'){ if(m.now) CLOCK_OFF = m.now - Date.now(); }
          if(m.type === 'state' && m.state && m.rev >= rev){ rev = m.rev; S = m.state; RM.got = true; queueRender(); } });
        conn.on('close', () => { RM.ok = false; rmRemoteBar(); setTimeout(connect, 1500); }); };
      if(RM.peer.open) go2(); else RM.peer.once('open', go2);

    connect();
    setInterval(() => { if(RM.ok) rmSend({type:'ping'}); if(RM.ok && Date.now() - RM.last > 8000){ RM.ok = false; try{ RM.conn.close(); }catch(e){} rmRemoteBar(); } }, 3000);

function go(i){
  const l = flat(); if(!l.length) return;
  i = clamp(i, 0, l.length - 1);
  const sl = l[i];
  if(sl.key !== S.live.pos){
    const prev = cur();
    S.live.pos = sl.key;
    const keep = tMode(sl.g) === 'game' && prev && prev.g.id === sl.g.id;
    if(!keep){ const d = slideDur(sl); S.live.timer = {dur:d, rem:d, endsAt:0, running:false}; }
  }
  S.live.overlay = null; UI.search = '';
  commit();
  requestAnimationFrame(() => { const el = document.querySelector('.rd-s.on'); if(el) el.scrollIntoView({block:'nearest'}); });
}
function goKey(k){ const l = flat(); const i = l.findIndex(x => x.key === k); if(i >= 0) go(i); }
function step(d){ go(curIdx() + d); }
function stepGame(d){
  const l = flat(), i = curIdx(l), gi = l[i] ? l[i].gi : 0;
  if(d > 0){ const j = l.findIndex((x, k) => k > i && x.gi !== gi); if(j >= 0) go(j); }
  else { const first = l.findIndex(x => x.gi === gi); if(i > first) go(first); else { const pg = l[first - 1]; if(pg){ go(l.findIndex(x => x.gi === pg.gi)); } } }
}
function act(what){ const sl = cur(); if(!sl || sl.kind === 'intro') return; const c = ctx(sl); const f = c.def[what]; if(f){ f(c); if(what === 'reveal') beep('good'); commit(); } }
function numKey(n){ const sl = cur(); if(!sl || !sl.it) return; const c = ctx(sl); if(c.def.num){ c.def.num(c, n); commit(); } }
function snap(id){ return S.live.items[id] ? clone(S.live.items[id]) : null; }
function addScore(teamId, delta, opt){
  opt = opt || {};
  const t = teamById(teamId); if(!t || (!delta && !opt.force)) { if(!opt.noCommit) commit(); return; }
  const before = t.score; t.score = Math.max(0, t.score + (Number(delta) || 0));
  const applied = t.score - before;
  const cs = cur(); S.live.history.push({teamId, delta:applied, label:opt.label || '', group:opt.group || null, snapId:opt.snapId, snap:opt.snap, gid:opt.gid || (cs ? grpKey(cs.g) : null)});
  if(S.live.history.length > 3000) S.live.history.shift();
  if(!opt.silentBeep) beep(delta > 0 ? 'good' : delta < 0 ? 'bad' : 'good');
  if(!opt.noCommit) commit();
}
// plusieurs équipes d'un coup, annulables ensemble avec ⌘Z. list = [[teamId, delta], ...]
function addMany(list, opt){
  opt = opt || {}; const group = uid();
  list = list.filter(x => teamById(x[0]));
  if(!list.length){ addScore(null, 0, {}); return; }
  list.forEach((x, i) => addScore(x[0], x[1], {group, force:true, noCommit:true, silentBeep:i > 0, snapId:i === 0 ? opt.snapId : undefined, snap:i === 0 ? opt.snap : undefined}));
  commit();
}
function undo(){
  const H = S.live.history; if(!H.length){ toast('Rien à annuler'); return; }
  const first = H[H.length - 1], parts = [];
  do {
    const h = H.pop();
    const t = teamById(h.teamId); if(t) t.score = Math.max(0, t.score - h.delta);
    if(h.snapId){ if(h.snap) S.live.items[h.snapId] = h.snap; else delete S.live.items[h.snapId]; }
    if(h.delta) parts.push((h.delta > 0 ? '+' : '') + h.delta + ' ' + (t ? t.name : ''));
  } while(first.group && H.length && H[H.length - 1].group === first.group);
  toast('↩ Annulé' + (parts.length ? ' : ' + parts.join(', ') : ''));
  commit();
}

  for(let k = 1; k <= ts.length; k++){ const t = ts[(i + k) % ts.length]; if((c.L.err[t.id] || 0) < mx){ c.L.turn = t.id; return; } } }

function luMatches(c, q){
  q = norm(q); if(!q) return [];
  const out = [];
  const add = (key, nm, team, bench) => { if(!nm) return; const n = norm(nm), words = n.split(' ');
    const score = n === q ? 3 : words.includes(q) ? 2 : (n.includes(q) ? 1 : 0);
    if(score) out.push({key, name:nm, team, bench, found:!!c.L.shown[key], score}); };
  [['l', c.it.left], ['r', c.it.right]].forEach(([k, sd]) => { sd.players.forEach((nm, i) => add(k + i, nm, sd.name, false)); subsOf(sd).forEach((nm, i) => add(k + 's' + i, nm, sd.name, true)); });
  return out.sort((a, b) => b.score - a.score || a.found - b.found || a.bench - b.bench);

      units:grp.map((x, i) => (String(x.title).split(' · ')[1] || 'Série ' + (i + 1))),
      get:i => grp[i].opts.team || null, set:(i, t) => { grp[i].opts.team = t || ''; }, swap:false};
  }
  if(g.type === 'password' && g.items.length > 1)
    return {key:'p' + g.id, title:g.title, icon:tplOf(g).icon || '🗣️', units:g.items.map((x, i) => 'Liste ' + (i + 1)),

function handleKey(e){
  const k = e.key;
  if((e.ctrl || e.meta) && (k === 'z' || k === 'Z')){ undo(); return true; }
  if(e.ctrl || e.meta || e.alt) return false;
  if(k === 'ArrowRight' || k === 'PageDown'){ e.shift ? stepGame(1) : step(1); return true; }
  if(k === 'ArrowLeft' || k === 'PageUp'){ e.shift ? stepGame(-1) : step(-1); return true; }
  if(k === 'Home'){ go(0); return true; }
  if(k === 'End'){ go(flat().length - 1); return true; }
  if(k === ' ' || k === 'Spacebar'){ timerToggle(); return true; }
  { const s0 = cur(); if(s0 && s0.it && T[s0.g.type] && T[s0.g.type].key && !e.shift && T[s0.g.type].key(ctx(s0), k.length === 1 ? k.toLowerCase() : k)) return true; }
  if(k === 'Enter'){ const sl = cur(); if(sl && (sl.g.type === 'lineup' || sl.g.type === 'sudden' || sl.g.type === 'auction') && !IS_TV){ const el = document.getElementById(sl.g.type === 'lineup' ? 'luSearch' : sl.g.type === 'auction' ? 'auSearch' : 'sdSearch'); if(el && !el.disabled){ el.focus(); return true; } } act('reveal'); return true; }
  if(k === 'Backspace'){ act('hide'); return true; }
  const lk = k.length === 1 ? k.toLowerCase() : k;
  if(lk === 't'){ timerReset(); return true; }
  if(lk === 'x'){ flash('x'); return true; }
  if(lk === 's'){ toggleScores(); return true; }
  if(lk === 'c'){ toggleOverlay('rank'); return true; }
  if(lk === 'b' || k === '.'){ toggleOverlay('black'); return true; }
  if(/^[1-9]$/.test(k)){ numKey(Number(k)); return true; }
  if(k === '?' || lk === 'h'){ UI.help = !UI.help; renderRegie(); return true; }
  if(k === 'Escape'){ if(UI.help){ UI.help = false; renderRegie(); } else if(S.live.overlay){ S.live.overlay = null; commit(); } return true; }
  return false;
}
document.addEventListener('keydown', e => {

  }

  const done = handleKey({key:e.key, shift:e.shiftKey, ctrl:e.ctrlKey, meta:e.metaKey, alt:e.altKey});
  if(done) e.preventDefault();
});

function exportQuiz(){
  const name = (S.doc.name || 'quiz').replace(/[^\wÀ-ÿ\- ]+/g, '').trim().replace(/\s+/g, '_') || 'quiz';
  const data = JSON.stringify({app:'QuizFoot', version:3, savedAt:new Date().toISOString(), doc:S.doc}, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([data], {type:'application/json'}));
  a.download = name + '.qft';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('💾 Fichier « ' + name + '.qft » téléchargé');
}
function importQuiz(input){
  const f = input.files && input.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = e => {
    try{
      const data = JSON.parse(e.target.result);
      let doc;
      if(data.version === 3 && data.doc) doc = data.doc;
      else doc = fromOld(data.state || data);
      if(!confirm('Charger « ' + f.name + ' » ? Le quiz actuel sera remplacé.')) return;
      S = {doc:fixDoc(doc), live:newLive(), rev:0}; UI.sel = 'teams'; commit(); toast('✅ Quiz chargé');
    }catch(err){ console.error(err); alert('Impossible de lire ce fichier. Vérifie que c’est bien un fichier .qft'); }
  };
  r.readAsText(f); input.value = '';
}
function importOldStorage(){
  try{ const o = JSON.parse(localStorage.getItem(OLD_STORE)); if(!o) return toast('Aucune donnée de l’ancien logiciel trouvée');
    if(!confirm('Reprendre les données de l’ancien logiciel ? Le quiz actuel sera remplacé.')) return;
    S = {doc:fromOld(o), live:newLive(), rev:0}; UI.sel = 'teams'; commit(); toast('✅ Données reprises'); }catch(e){ toast('Lecture impossible'); }
}
function fixDoc(d){
  d.teams = (d.teams && d.teams.length ? d.teams : [newTeam(0), newTeam(1)]);
  d.teams.forEach(t => { if(!Array.isArray(t.players)) t.players = splitNames(t.name).length > 1 ? splitNames(t.name) : []; });
  d.settings = Object.assign({theme:'tricolore', bg:'images/FOND.png', veil:30, sound:true}, d.settings || {});
  d.games = (d.games || []).filter(g => T[g.type]);
  d.games.forEach(g => { g.intro = Object.assign({on:false, image:'', sub:''}, g.intro || {}); const had = g.opts || {};
    g.opts = Object.assign({timer:0}, T[g.type].opts ? T[g.type].opts() : {}, had); g.items = g.items || [];
    if(!had.timerMode) g.opts.timerMode = Number(had.timer) > 0 ? 'item' : (had.timer === undefined ? g.opts.timerMode || 'none' : 'none');
    if(g.type === 'money') g.items.forEach(it => moFixItem(g, it));
    if(g.type === 'drop' && g.intro.sub) g.intro.sub = g.intro.sub.replace(/quitte ou double/gi, 'tout ou rien'); });
  return d;
}
function fromOld(o){
  o = o || {};
  const d = newDoc();
  const isDef = (v, re) => !v || re.test(String(v).trim());
  d.teams = [['A', 0], ['B', 1], ['C', 2]].map(([k, i]) => { const t = newTeam(i); if(o['team' + k]) t.name = o['team' + k]; t.score = Number(o['score' + k]) || 0; return t; });
  if(o.bgUrl && !String(o.bgUrl).startsWith('data:')) d.settings.bg = o.bgUrl;
  const G = k => d.games.find(g => g.tpl === k);
  const keepOne = (g) => { if(!g.items.length) g.items.push(T[g.type].newItem(g, 0)); };
  // Accueil
  if(o.homeUrl && !String(o.homeUrl).startsWith('data:')) G('accueil').items = [Object.assign(T.slides.newItem(G('accueil')), {image:o.homeUrl, full:true})];
  // Parcours
  const pc = G('parcours'); pc.items = (o.careers || []).filter(c => c.url && !String(c.url).startsWith('data:')).map(c => Object.assign(T.slides.newItem(pc), {image:c.url, answer:isDef(c.name, /^Parcours joueur \d+$/) ? '' : c.name})); keepOne(pc);
  // Photos
  const ph = G('photo'); ph.items = (o.photos || []).filter(p => p.url && !String(p.url).startsWith('data:')).map(p => Object.assign(T.slides.newItem(ph), {image:p.url, answer:isDef(p.name, /^Joueur \d+$/) ? '' : p.name})); keepOne(ph);
  // 4 en 1
  const fo = G('four'); fo.items = (o.fourList || []).filter(f => f.image || (f.clubs || []).some(c => !/^CLUB \d$/.test(c))).map(f => Object.assign(T.slides.newItem(fo), {image:f.image || '', title:isDef(f.title, /^PROPOSITION \d+$/) ? '' : f.title, answer:(f.clubs || []).filter(c => !/^CLUB \d$/.test(c)).join(' · ')})); keepOne(fo);
  // Five
  const fv = G('five'); fv.items = (o.fiveList || []).map(f => ({id:uid(), theme:isDef(f.theme, /^Thème \d+$/) ? '' : f.theme, player:isDef(f.player, /^Joueur mystère \d+$/) ? '' : f.player, hints:(f.hints || []).slice(0, 5).map(h => isDef(h, /^Indice \d$/) ? '' : h).concat(['','','','','']).slice(0, 5)}));
  fv.items = fv.items.filter(f => f.theme || f.player || f.hints.some(Boolean)); keepOne(fv);
  // Mort subite
  if(o.sudden && o.sudden.target) G('sudden').opts.target = o.sudden.target;
  // Risk
  if(o.riskGame && o.riskGame.image) G('risk').items[0].image = o.riskGame.image;
  // Enchères
  const au = G('auction'); au.items = (o.auctionList || []).map(a => ({id:uid(), theme:isDef(a.theme, /^THÈME \d+$/) ? '' : a.theme, image:a.image || '', answers:''})).filter(a => a.theme || a.image); keepOne(au);
  // XI
  const xi = G('xi'); xi.items = (o.xiList || []).map(x => ({id:uid(), theme:isDef(x.theme, /^Thème XI \d+$/) ? '' : x.theme, answers:(x.answers || []).slice(0, 8).map((a, j) => ({text:isDef(a.text, /^Réponse \d+$/) ? '' : a.text, pts:Number(a.pts) || XI_PTS[j]}))})).filter(x => x.theme || x.answers.some(a => a.text)); keepOne(xi);
  // Compo
  const lu = G('lineup');
  const ms = o.lineupMatches || (o.lineup ? [Object.assign({title:'MATCH 1'}, o.lineup)] : []);
  lu.items = ms.map((m, i) => { const sd = (arr, nm, form) => ({name:nm || '', form:FORMATIONS[form] ? form : '4-3-3', players:Array.from({length:11}, (_, k) => { const p = (arr || [])[k]; return p && !/^[A-Z]{2,3} \d+$/.test(p.name || '') ? p.name : ''; })});
    return {id:uid(), title:m.title || 'MATCH ' + (i + 1), left:sd(m.left, m.leftName, m.leftForm), right:sd(m.right, m.rightName, m.rightForm)}; })
    .filter((m, i) => m.left.players.some(Boolean) || m.right.players.some(Boolean) || !/^MATCH \d+$/.test(m.title.trim()) || !/^ÉQUIPE \d$/.test(m.left.name));
  keepOne(lu);
  // Money
  if(o.money && o.money.themes) { const mg = G('money'); mg.items[0].themes = o.money.themes.map(n => ({name:n, lv:[]})); moFixItem(mg, mg.items[0]); }
  // Victoire
  if(o.victoryUrl && !String(o.victoryUrl).startsWith('data:')) G('winner').opts.image = o.victoryUrl;
  if(o.quizName && o.quizName !== 'Quiz sans nom') d.name = o.quizName;
  return d;
}

  const gs = S.doc.games;
  let side = `<div class="side-i ${UI.sel === 'teams' ? 'on' : ''}" onclick="selPanel('teams')">👥 <span class="nm">Équipes & apparence</span><span class="cnt">${teams().length}</span></div>
    <div class="side-i ${UI.sel === 'save' ? 'on' : ''}" onclick="selPanel('save')">💾 <span class="nm">Sauvegarder / charger</span></div>
    <div class="side-i ${UI.sel === 'season' ? 'on' : ''}" onclick="selPanel('season')">🏆 <span class="nm">Championnat de la saison</span></div>
    <div class="sep"></div><div class="side-h">Déroulé du quiz</div>`;
  side += gs.map((g, gi) => `<div class="side-i ${UI.sel === g.id ? 'on' : ''}" onclick="selPanel('${g.id}')">${tplOf(g).icon || '•'} <span class="nm" data-show="games.${gi}.title">${esc(g.title)}</span>
    <span class="cnt">${T[g.type].single ? '' : g.items.length}</span><span class="mv"><button onclick="event.stopPropagation();moveGame(${gi},-1)" title="Monter">▲</button><button onclick="event.stopPropagation();moveGame(${gi},1)" title="Descendre">▼</button></span></div>`).join('');
  side += `<button class="btn primary full mt" onclick="selPanel('add')">＋ Ajouter un jeu</button>`;

  let main = '';
  const g = gs.find(x => x.id === UI.sel);
  if(UI.sel === 'teams') main = teamsPanel();
  else if(UI.sel === 'save') main = savePanel();
  else if(UI.sel === 'season') main = seasonPanel();
  else if(UI.sel === 'add') main = `<div class="card"><h2>Ajouter un jeu</h2><p class="mut">Il sera ajouté ${gs.length ? 'à la fin du déroulé' : 'au déroulé'}. Tu pourras ensuite le déplacer avec ▲ ▼.</p>
    <div class="tpl">${TEMPLATES.map(t => `<button onclick="addGame('${t.key}')"><span class="ic">${t.icon}</span><b>${esc(t.label)}</b><span>${esc(t.desc)}</span></button>`).join('')}</div>
    <p class="small mut mt2">💡 Tu as une idée de nouveau jeu ? Décris-le à Claude, il pourra l’ajouter à cette liste.</p></div>`;
  else if(g){
    const gi = gs.indexOf(g), def = T[g.type], tp = tplOf(g);
    main = `<div class="card"><div class="row"><span style="font-size:30px">${tp.icon || ''}</span><div style="flex:1"><div class="small mut" style="font-weight:800;text-transform:uppercase;letter-spacing:.06em">${esc(tp.label || g.type)}</div><h2 data-show="games.${gi}.title">${esc(g.title)}</h2></div>
      <button class="btn sm" onclick="dupGame(${gi})">⧉ Dupliquer</button><button class="btn sm red" onclick="delGame(${gi})">🗑 Supprimer le jeu</button></div>
      ${fText(`games.${gi}.title`, g.title, 'Nom du jeu (affiché sur la TV)')}
      ${def.single ? '' : `<details ${g.intro.on ? 'open' : ''}><summary>🎬 Affiche de début de jeu</summary>
        <label class="chk"><input type="checkbox" data-p="games.${gi}.intro.on" data-rr ${g.intro.on ? 'checked' : ''}>Afficher une affiche avant le jeu</label>
        <p class="small mut">Sans image, une affiche est créée automatiquement avec le nom du jeu. Avec une image (ta slide exportée en JPG/PNG), elle s’affiche en plein écran.</p>
        ${imgField(`games.${gi}.intro.image`, g.intro.image, 'Image de l’affiche (facultatif)')}
        ${fText(`games.${gi}.intro.sub`, g.intro.sub, 'Texte sous le titre (règles, facultatif)', 'Ex : 5 indices, 5 points pour le premier…', true)}</details>`}
      </div>
      ${def.single ? '' : timerCard(g, gi)}
      <div class="ed">${def.edit(g, gi)}</div>`;
  } else main = `<div class="info">Choisis un élément à gauche.</div>`;
  return `<div class="prep"><div class="col card" data-keep="side">${side}</div><div class="col" data-keep="main">${main}</div></div>`;
}
function timerCard(g, gi){
  const tm = tMode(g), per = ['slides','drop','intrus'].includes(g.type);
  return `<div class="card"><h3>⏱ Chrono de ce jeu</h3>
    <div class="row">${[['none','Pas de chrono'],['item', g.type === 'intrus' ? 'Un chrono par tour' : 'Un chrono par question'],['game','Un seul chrono pour tout le jeu']].map(([k, l]) => `<button class="btn ${tm === k ? 'primary' : ''}" onclick="setTMode(${gi},'${k}')">${l}</button>`).join('')}</div>
    ${tm === 'none' ? '' : `<div class="g2"><div>${fNum(`games.${gi}.opts.timer`, g.opts.timer, tm === 'game' ? 'Durée pour tout le jeu (secondes)' : 'Durée par question (secondes)')}</div>
      <div class="small mut" style="align-self:end;padding-bottom:8px">${tm === 'game' ? 'Le chrono continue quand tu passes à la question suivante (ex : 90 s pour les 10 questions rapides).' : 'Le chrono se remet à zéro à chaque question (ex : 20 s par affiche dans le 4 en 1).' + (per ? ' Tu peux aussi mettre une durée différente sur une question précise.' : '')} 90 s = 1 min 30.</div></div>`}</div>`;
}
function teamsPanel(){
  const st = S.doc.settings;
  return `<div class="card"><h2>👥 Équipes</h2>
    <label class="fl">Nombre d’équipes</label><div class="cntbtns">${[2,3,4,5,6].map(n => `<button class="btn ${teams().length === n ? 'primary' : ''}" onclick="setTeamCount(${n})">${n}</button>`).join('')}</div>
    ${teams().map((t, i) => `<div class="teamed"><input type="color" data-p="teams.${i}.color" value="${esc(t.color)}"><input id="f_teams.${i}.name" data-p="teams.${i}.name" value="${esc(t.name)}"><input id="f_teams.${i}.score" type="number" data-p="teams.${i}.score" data-num value="${t.score}" title="Score"></div>
      <div class="plrow"><span class="small mut">Joueurs :</span>${(t.players || []).map((pn, j) => `<span class="plin"><input id="f_teams.${i}.players.${j}" data-p="teams.${i}.players.${j}" value="${esc(pn)}" placeholder="Prénom"><button class="btn sm ghost" title="Retirer" onclick="delPlayer(${i},${j})">✕</button></span>`).join('')}<button class="btn sm" onclick="addPlayer(${i})">＋ joueur</button>${!(t.players || []).length && splitNames(t.name).length > 1 ? `<button class="btn sm ghost" onclick="playersFromName(${i})">Reprendre « ${esc(t.name)} »</button>` : ''}</div>`).join('')}
    <p class="small mut">Les joueurs servent aux face à face, au Money Time (un joueur par tour) et au championnat de la saison. Écris-les comme dans le classement de la saison.</p>
    <div class="row mt"><button class="btn" onclick="resetScores()">Remettre les scores à 0</button><button class="btn gold" onclick="resetNight()">🔄 Nouvelle soirée (scores + réponses à zéro)</button></div></div>
    <div class="card"><h2>🎨 Apparence de l’écran TV</h2>
      ${fText('name', S.doc.name, 'Nom du quiz')}
      <label class="fl">Style</label><div class="row">${[['tricolore','🇫🇷 Tricolore'],['bleu','🔵 Bleu vif'],['clair','⚪ Clair'],['nuit','🌙 Nuit']].map(([k, l]) => `<button class="btn ${st.theme === k ? 'primary' : ''}" onclick="S.doc.settings.theme='${k}';commit()">${l}</button>`).join('')}</div>
      ${imgField('settings.bg', st.bg, 'Image de fond (facultatif)')}
      <label class="fl">Assombrir le fond : <span data-show="settings.veil">${st.veil}</span>% <span class="mut" style="text-transform:none;font-weight:600">(l’ancien logiciel était à 72 %)</span></label><input type="range" min="0" max="85" step="5" data-p="settings.veil" data-num value="${st.veil}">
      <label class="chk"><input type="checkbox" data-p="settings.sound" ${st.sound ? 'checked' : ''}>Sons (bonne réponse, erreur, fin du chrono)</label>
      <div class="mt2" style="max-width:640px"><div class="small mut" style="margin-bottom:6px">Aperçu :</div><div id="pvHost"></div></div></div>`;
}
function savePanel(){
  const hasOld = !!localStorage.getItem(OLD_STORE);
  return `<div class="card"><h2>💾 Sauvegarder / charger</h2>
    <div class="info">Tout est <b>sauvegardé automatiquement</b> dans ce navigateur à chaque modification. Pour garder une vraie copie (ou préparer plusieurs quiz), exporte un fichier <b>.qft</b>.</div>
    <div class="row mt2"><button class="btn primary lg" onclick="exportQuiz()">⬇️ Exporter ce quiz (.qft)</button>
      <label class="btn lg">⬆️ Charger un quiz (.qft)<input type="file" accept=".qft,.json,application/json" hidden onchange="importQuiz(this)"></label></div>
    <p class="small mut">Les anciens fichiers .qft (de l’ancien logiciel) sont acceptés : ils sont convertis automatiquement.</p>
    ${hasOld ? `<div class="sep"></div><p><b>Ancien logiciel détecté</b> dans ce navigateur.</p><button class="btn" onclick="importOldStorage()">♻️ Reprendre les données de l’ancien logiciel</button>` : ''}
    <div class="sep"></div><button class="btn red" onclick="newQuiz()">🗑 Nouveau quiz (repartir de zéro)</button></div>
    <div class="card"><h2>🖼️ Tes images</h2><p>Mets toutes tes images (affiches, photos, slides exportées depuis Google Slides en JPG/PNG) dans le dossier <b>images</b>, à côté de ce fichier. Ensuite, dans chaque champ image, clique sur <b>📁 Choisir</b> et sélectionne l’image.</p>
      <p class="small mut">Pour exporter une slide Google : Fichier → Télécharger → Image JPEG (slide actuelle).</p></div>`;
}

function captureUI(){
  const a = document.activeElement, st = {};
  if(a && a.id) st.focus = {id:a.id, s:a.selectionStart, e:a.selectionEnd};
  document.querySelectorAll('[data-keep]').forEach(el => st['sc_' + el.dataset.keep] = el.scrollTop);
  st.win = window.scrollY;
  return st;
}
function restoreUI(st){
  document.querySelectorAll('[data-keep]').forEach(el => { const v = st['sc_' + el.dataset.keep]; if(v) el.scrollTop = v; });
  if(st.win) window.scrollTo(0, st.win);
  if(st.focus){ const el = document.getElementById(st.focus.id); if(el){ el.focus({preventScroll:true}); try{ if(st.focus.s != null) el.setSelectionRange(st.focus.s, st.focus.e); }catch(e){} } }
}
function renderRegie(){
  if(IS_TV) return;
  const keep = captureUI();
  if(IS_REMOTE){ UI.mode = 'anim'; if(!RM.got){ app.innerHTML = `<div class="rmwait">📱 Connexion au Mac…<br><span>Laisse le logiciel ouvert sur le Mac.</span></div>` + rmBarHTML(); return; } }
  app.innerHTML = headerHTML() + (UI.mode === 'anim' ? animHTML() : prepHTML()) + (UI.help ? helpHTML() : '') + (UI.saveNight ? seasonSaveHTML() : '') + (UI.rm ? rmModalHTML() : '') + (IS_REMOTE ? rmBarHTML() : '');
  if(UI.rm) setTimeout(() => { rmStatus(); if(!document.querySelector('#rmQR svg')) rmDrawQR(); }, 0);
  const host = document.getElementById('pvHost');
  if(host){ host.appendChild(preview.root); preview.fit(); preview.render(); fitStage(preview); }
  updTvStatus();
  tickTimers(app);
  restoreUI(keep);
}

/* =========================================================
   DÉMARRAGE
   ========================================================= */
let tvStage = null;
function tvRender(){ if(tvStage){ tvStage.render(); } }
function load(){
  if(IS_REMOTE){ S = {doc:newDoc(), live:newLive(), rev:0}; return; }
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(STORE)); }catch(e){}
  if(s && s.doc){ S = {doc:fixDoc(s.doc), live:Object.assign(newLive(), s.live || {}), rev:s.rev || 0}; }
  else {
    let old = null; try{ old = JSON.parse(localStorage.getItem(OLD_STORE)); }catch(e){}
    S = {doc: old ? fromOld(old) : newDoc(), live:newLive(), rev:0};
    if(old && !IS_TV) setTimeout(() => toast('♻️ J’ai repris les données de ton ancien logiciel'), 500);
  }
  rev = S.rev || 0;
  if(!S.live.pos){ const l = flat(); if(l[0]) S.live.pos = l[0].key; }
  try{ const u = JSON.parse(localStorage.getItem(STORE_UI)); if(u){ UI.mode = u.mode || UI.mode; UI.sel = u.sel || UI.sel; } }catch(e){}
}
load();
if(IS_TV){
  document.title = 'Quiz Foot — TV';
  document.body.className = 'tvbody';
  tvStage = makeStage(true);
  app.appendChild(tvStage.root);
  const hint = document.createElement('div'); hint.className = 'tvhint'; hint.textContent = 'Appuie sur F (ou double-clique) pour le plein écran'; document.body.appendChild(hint);
  setTimeout(() => hint.classList.add('hide'), 6000);
  window.addEventListener('resize', () => tvStage.fit());
  document.addEventListener('dblclick', toggleFS);
  let mt; document.addEventListener('mousemove', () => { document.body.classList.add('mouse'); clearTimeout(mt); mt = setTimeout(() => document.body.classList.remove('mouse'), 2000); });
  tvStage.fit(); tvStage.render();
  tvSend({type:'hello'});
  setInterval(() => tickTimers(document), 100);
  // filet de sécurité si aucun canal ne passe
  setInterval(() => { try{ const s = JSON.parse(localStorage.getItem(STORE)); if(s && s.rev > rev){ rev = s.rev; S = s; tvRender(); } }catch(e){} }, 1000);
} else {
  document.body.className = 'regie' + (IS_REMOTE ? ' remote' : '');
  if(IS_REMOTE){ document.title = 'Quiz Foot — Télécommande'; S = {doc:newDoc(), live:newLive(), rev:0}; rev = 0; }
  preview = makeStage(false);
  renderRegie();
  window.addEventListener('resize', () => preview.fit());
  if('ResizeObserver' in window) new ResizeObserver(() => preview.fit()).observe(preview.root);
  setInterval(() => { tickTimers(document); if(!IS_REMOTE) timerWatch(); }, 100);
  if(IS_REMOTE) rmStartRemote();
  else { setInterval(() => { post({type:'ping'}); updTvStatus(); }, 1500); persist(); try{ if(localStorage.getItem('quizfoot_remote_on') === '1') rmStartHost(); }catch(e){} }
}
</script>
